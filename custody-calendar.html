                                                <select value={sEOWDay} onChange={e => setSEOWDay(e.target.value)} className="form-input">
                                                    <option value="fri">Friday</option>
                                                    <option value="sat">Saturday</option>
                                                </select>
                                            </div>
                                            {sPreset === 'eow-midweek' && (
                                                <div>
                                                    <label className="text-sm font-medium text-gray-700 mb-2" style={{ display: 'block' }}>Midweek Overnight</label>
                                                    <select value={sMidweek} onChange={e => setSMidweek(parseInt(e.target.value))} className="form-input">
                                                        <option value={1}>Monday</option>
                                                        <option value={2}>Tuesday</option>
                                                        <option value={3}>Wednesday</option>
                                                        <option value={4}>Thursday</option>
                                                    </select>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {(sPreset === 'joint-weekly' || sPreset === '2-2-3') && (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
                                            <div>
                                                <label className="text-sm font-medium text-gray-700 mb-2" style={{ display: 'block' }}>{sPreset === '2-2-3' ? 'First parent (starts cycle)' : 'Parent with Week 1'}</label>
                                                <select value={sP1} onChange={e => setSP1(e.target.value)} className="form-input">
                                                    {dParents.map(p => <option key={p} value={p}>{p}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="text-sm font-medium text-gray-700 mb-2" style={{ display: 'block' }}>{sPreset === '2-2-3' ? 'Second parent' : 'Parent with Week 2'}</label>
                                                <select value={sP2} onChange={e => setSP2(e.target.value)} className="form-input">
                                                    {dParents.map(p => <option key={p} value={p}>{p}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    )}

                                    <label className="text-sm font-medium text-gray-700 mb-2" style={{ display: 'block' }}>Applies to children</label>
                                    <div className="flex flex-wrap gap-2 mb-4">
                                        {dChildren.map(c => (
                                            <label key={c} className="config-item" style={{ cursor: 'pointer' }}>
                                                <input type="checkbox" checked={sChildren.includes(c)} onChange={() => toggleSChild(c)} /> {c}
                                            </label>
                                        ))}
                                    </div>

                                    {assignmentError && <p style={{ color: '#b91c1c', fontSize: '0.8rem', marginBottom: '0.5rem' }}>{assignmentError}</p>}
                                    <button className="btn btn-success" onClick={addAssignment} disabled={Boolean(assignmentError)} style={{ opacity: assignmentError ? 0.45 : 1 }}>+ Add this schedule</button>
                                </div>
                            </div>
                        )}

                        {step === 3 && (
                            <div>
                                <h2 className="text-2xl font-bold mb-2">Review</h2>
                                <p className="mb-2"><strong>Parents:</strong> {dParents.map((p, i) => p + (i === 0 ? ' (Primary)' : '')).join(', ') || '—'}</p>
                                <p className="mb-2"><strong>Children:</strong> {dChildren.join(', ') || '—'}</p>
                                <p className="mb-2"><strong>Schedules:</strong></p>
                                {assignments.length === 0 ? (
                                    <p className="text-sm text-gray-600">None — you'll start with a blank calendar to fill in manually.</p>
                                ) : (
                                    <ul style={{ marginTop: 0, paddingLeft: '1.2rem' }}>
                                        {assignments.map(a => (
                                            <li key={a.id} style={{ fontSize: '0.9rem', marginBottom: 4 }}>{presetLabel(a.preset)} for {a.children.join(', ')} ({a.start} → {a.end})</li>
                                        ))}
                                    </ul>
                                )}
                                <p className="text-sm text-gray-600 mt-4">Manual entries are preserved. Recurring entries are regenerated from these saved schedule definitions.</p>
                            </div>
                        )}

                        {/* nav */}
                        <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: '1.5rem' }}>
                            <button className="btn btn-secondary" onClick={step === 0 ? onCancel : () => setStep(step - 1)}>{step === 0 ? 'Cancel' : 'Back'}</button>
                            {step < 3
                                ? <button className="btn btn-primary" disabled={!canNext} style={{ opacity: canNext ? 1 : 0.5 }} onClick={() => setStep(step + 1)}>Next</button>
                                : <button className="btn btn-success" onClick={finish}>Create Calendar</button>}
                        </div>
                    </div>
                </div>
            );
        }

        function CustodyCalendarApp() {
            const savedData = useRef(loadWebData()).current;
            // Configuration state
            const [parents, setParents] = useState(savedData?.parents || []);
            const [children, setChildren] = useState(savedData?.children || []);
            const [parentColors, setParentColors] = useState(savedData?.parentColors || {});
            const [childColors, setChildColors] = useState(savedData?.childColors || {});
            const [parentLocations, setParentLocations] = useState(savedData?.parentLocations || {}); // parent -> home address
            const [parentPhones, setParentPhones] = useState(savedData?.parentPhones || {});          // parent -> contact number
            const [editingColor, setEditingColor] = useState(null); // { type: 'parent'|'child', name }
            const [viewMode, setViewMode] = useState(savedData?.viewMode || 'calendar');
            const [showWizard, setShowWizard] = useState(!savedData?.parents?.length);
            const [scheduleAssignments, setScheduleAssignments] = useState(savedData?.scheduleAssignments || []);

            const completeWizard = ({ parents: wp, parentColors: wpc, children: wc, childColors: wcc, entries: we, scheduleAssignments: wa }) => {
                setParents(wp);
                setParentColors(wpc);
                setChildren(wc);
                setChildColors(wcc);
                setEntries(we);
                setScheduleAssignments(wa);
                setShowWizard(false);
                setViewMode('calendar');
            };
            const [showConfig, setShowConfig] = useState(true);
            const [showReporting, setShowReporting] = useState(false);
            const [newParentName, setNewParentName] = useState('');
            const [newChildName, setNewChildName] = useState('');

            const [entries, setEntries] = useState(savedData?.entries || [
                {
                    id: generateId(),
                    parent: '',
                    beginDate: '',
                    endDate: '',
                    childrenPresent: {},
                    note: ''
                }
            ]);

            const [reportingMode, setReportingMode] = useState(savedData?.reportingMode || 'custom');
            const [customStart, setCustomStart] = useState(savedData?.customStart || '');
            const [customEnd, setCustomEnd] = useState(savedData?.customEnd || '');
            const [quarterYear, setQuarterYear] = useState(savedData?.quarterYear || new Date().getFullYear());
            const [quarter, setQuarter] = useState(savedData?.quarter || 'Q1');
            const [preset, setPreset] = useState(savedData?.preset || 'year-to-date');
            const [analysisChild, setAnalysisChild] = useState(savedData?.analysisChild || 'all');

            // Schedule generator state
            const [showScheduleGen, setShowScheduleGen] = useState(false);
            const [schedulePattern, setSchedulePattern] = useState('eow');
            const [scheduleStart, setScheduleStart] = useState('');
            const [scheduleEnd, setScheduleEnd] = useState('');
            const [scheduleSecondaryParent, setScheduleSecondaryParent] = useState('');
            const [scheduleJointParent1, setScheduleJointParent1] = useState('');
            const [scheduleJointParent2, setScheduleJointParent2] = useState('');
            const [scheduleEOWDay, setScheduleEOWDay] = useState('fri');
            const [scheduleMidweekDow, setScheduleMidweekDow] = useState(3); // Wednesday

            const currentYear = new Date().getFullYear();
            const today = new Date();
            const todayStr = formatDate(today);

            useEffect(() => {
                try {
                    localStorage.setItem(WEB_STORAGE_KEY, JSON.stringify({
                        parents,
                        children,
                        parentColors,
                        childColors,
                        parentLocations,
                        parentPhones,
                        entries,
                        scheduleAssignments,
                        reportingMode,
                        customStart,
                        customEnd,
                        quarterYear,
                        quarter,
                        preset,
                        analysisChild,
                        viewMode,
                    }));
                } catch (error) {
                    console.warn('Could not save local custody data', error);
                }
            }, [parents, children, parentColors, childColors, parentLocations, parentPhones, entries, scheduleAssignments, reportingMode, customStart, customEnd, quarterYear, quarter, preset, analysisChild, viewMode]);

            // Generate year options
            const yearOptions = [];
            for (let year = currentYear - 5; year <= currentYear + 5; year++) {
                yearOptions.push(year);
            }

            // Configuration functions
            const addParent = () => {
                const name = newParentName.trim();
                if (name && !parents.includes(name)) {
                    setParents([...parents, name]);
                    setParentColors({ ...parentColors, [name]: nextColor(parentColors) });
                    setNewParentName('');
                }
            };

            const removeParent = (parent) => {
                if (parents.length > 1 && window.confirm(`Remove parent "${parent}"? This cannot be undone.`)) {
                    setParents(parents.filter(p => p !== parent));
                    const nc = { ...parentColors }; delete nc[parent]; setParentColors(nc);
                    const nl = { ...parentLocations }; delete nl[parent]; setParentLocations(nl);
                    const np = { ...parentPhones }; delete np[parent]; setParentPhones(np);
                }
            };

            const setPrimary = (parent) => {
                setParents([parent, ...parents.filter(p => p !== parent)]);
            };

            const setColor = (type, name, color) => {
                if (type === 'parent') setParentColors({ ...parentColors, [name]: color });
                else setChildColors({ ...childColors, [name]: color });
                setEditingColor(null);
            };

            const addChild = () => {
                if (newChildName.trim() && !children.includes(newChildName.trim())) {
                    const childName = newChildName.trim();
                    setChildren([...children, childName]);
                    setChildColors({ ...childColors, [childName]: nextColor(childColors) });

                    // Add this child to all existing entries
                    setEntries(entries.map(entry => ({
                        ...entry,
                        childrenPresent: {
                            ...entry.childrenPresent,
                            [childName]: true
                        }
                    })));

                    setNewChildName('');
                }
            };

            const removeChild = (child) => {
                if (children.length > 1 && window.confirm(`Remove child "${child}"? This cannot be undone.`)) {
                    setChildren(children.filter(c => c !== child));
                    const nc = { ...childColors }; delete nc[child]; setChildColors(nc);

                    // Remove this child from all entries
                    setEntries(entries.map(entry => {
                        const newChildrenPresent = { ...entry.childrenPresent };
                        delete newChildrenPresent[child];
                        return {
                            ...entry,
                            childrenPresent: newChildrenPresent
                        };
                    }));

                    // Reset analysis if it was set to the removed child
                    if (analysisChild === child) {
                        setAnalysisChild('all');
                    }
                }
            };

            // Calculate reporting window
            const reportingWindow = useMemo(() => {
                let start = '';
                let end = '';

                if (reportingMode === 'custom') {
                    start = customStart;
                    end = customEnd;
                } else if (reportingMode === 'quarter') {
                    const quarters = {
                        Q1: { start: `${quarterYear}-01-01`, end: `${quarterYear}-03-31` },
                        Q2: { start: `${quarterYear}-04-01`, end: `${quarterYear}-06-30` },
                        Q3: { start: `${quarterYear}-07-01`, end: `${quarterYear}-09-30` },
                        Q4: { start: `${quarterYear}-10-01`, end: `${quarterYear}-12-31` }
                    };
                    start = quarters[quarter].start;
                    end = quarters[quarter].end;
                } else if (reportingMode === 'preset') {
                    if (preset === 'year-to-date') {
                        start = `${currentYear}-01-01`;
                        end = todayStr;
                    } else if (preset === 'last-12-months') {
                        const startDate = new Date(today);
                        startDate.setFullYear(startDate.getFullYear() - 1);
                        start = formatDate(startDate);
                        end = todayStr;
                    } else if (preset === 'calendar-year') {
                        start = `${currentYear}-01-01`;
                        end = `${currentYear}-12-31`;
                    }
                }

                return { start, end };
            }, [reportingMode, customStart, customEnd, quarterYear, quarter, preset, currentYear, todayStr]);

            const summaryResult = useMemo(() => computeCustodySummary({
                entries,
                parents,
                children,
                start: reportingWindow.start,
                end: reportingWindow.end,
                childFilter: analysisChild,
            }), [entries, reportingWindow, analysisChild, children, parents]);
            const windowSummary = summaryResult.rows;

            // Calculate footer totals
            const footerTotals = useMemo(() => {
                let totalDays = 0;
                
                entries.forEach(entry => {
                    const days = daysInclusive(entry.beginDate, entry.endDate);
                    if (days !== "") {
                        totalDays += days;
                    }
                });
                return { totalDays };
            }, [entries]);

            const addRow = () => {
                const newChildrenPresent = {};
                children.forEach(child => {
                    newChildrenPresent[child] = true;
                });
                
                setEntries([...entries, {
                    id: generateId(),
                    parent: '',
                    beginDate: '',
                    endDate: '',
                    childrenPresent: newChildrenPresent,
                    note: ''
                }]);
            };

            const createEntryFromCalendar = (start, end, parent, childFilter, isException, name) => {
                const newChildrenPresent = {};
                children.forEach(child => { newChildrenPresent[child] = childFilter ? child === childFilter : true; });
                setEntries([...entries, {
                    id: generateId(),
                    parent,
                    beginDate: start,
                    endDate: end,
                    childrenPresent: newChildrenPresent,
                    note: name || '',
                    isException: Boolean(isException)
                }]);
            };

            const removeRow = (id) => {
                if (entries.length > 1) {
                    setEntries(entries.filter(entry => entry.id !== id));
                }
            };

            const updateEntry = (id, field, value) => {
                setEntries(entries.map(entry =>
                    entry.id === id ? { ...entry, [field]: value } : entry
                ));
            };

            const updateDateRange = (id, begin, end) => {
                setEntries(entries.map(entry =>
                    entry.id === id ? { ...entry, beginDate: begin, endDate: end } : entry
                ));
            };

            const updateChildPresent = (id, child, value) => {
                setEntries(entries.map(entry => {
                    if (entry.id === id) {
                        return {
                            ...entry,
                            childrenPresent: {
                                ...entry.childrenPresent,
                                [child]: value
                            }
                        };
                    }
                    return entry;
                }));
            };

            const clearAll = () => {
                if (window.confirm('Clear all entries? This cannot be undone.')) {
                    const newChildrenPresent = {};
                    children.forEach(child => {
                        newChildrenPresent[child] = true;
                    });
                    
                    setEntries([{
                        id: generateId(),
                        parent: '',
                        beginDate: '',
                        endDate: '',
                        childrenPresent: newChildrenPresent,
                        note: ''
                    }]);
                    setScheduleAssignments([]);
                }
            };

            const resetAll = () => {
                if (window.confirm('Reset all data? This erases all parents, children, colors, and entries and reopens the setup wizard. This cannot be undone.')) {
                    localStorage.removeItem(WEB_STORAGE_KEY);
                    setParents([]);
                    setChildren([]);
                    setParentColors({});
                    setChildColors({});
                    setParentLocations({});
                    setParentPhones({});
                    setEntries([{ id: generateId(), parent: '', beginDate: '', endDate: '', childrenPresent: {}, note: '' }]);
                    setScheduleAssignments([]);
                    setReportingMode('custom');
                    setCustomStart('');
                    setCustomEnd('');
                    setAnalysisChild('all');
                    setViewMode('calendar');
                    setShowWizard(true);
                }
            };

            const runScheduleGenerator = () => {
                let newEntries = [];
                if (!scheduleStart || !scheduleEnd || scheduleStart > scheduleEnd) {
                    alert('Set an end date on or after the start date.');
                    return;
                }
                if (parents.length < 2) {
                    alert('Add two parents before generating a shared schedule.');
                    return;
                }
                if (schedulePattern === 'eow' || schedulePattern === 'eow-midweek') {
                    if (!scheduleSecondaryParent || scheduleSecondaryParent === parents[0]) {
                        alert('Choose a weekend parent who is different from the primary parent.');
                        return;
                    }
                    newEntries = schedulePattern === 'eow'
                        ? generateEOWSchedule(scheduleSecondaryParent, scheduleStart, scheduleEnd, children, scheduleEOWDay)
                        : generateEOWMidweek(scheduleSecondaryParent, scheduleStart, scheduleEnd, children, scheduleEOWDay, scheduleMidweekDow);
                } else {
                    if (!scheduleJointParent1 || !scheduleJointParent2 || scheduleJointParent1 === scheduleJointParent2) {
                        alert('Choose two different parents.');
                        return;
                    }
                    newEntries = schedulePattern === '2-2-3'
                        ? generate223(scheduleJointParent1, scheduleJointParent2, scheduleStart, scheduleEnd, children)
                        : generateJointWeeklySchedule(scheduleJointParent1, scheduleJointParent2, scheduleStart, scheduleEnd, children);
                }
                if (newEntries.length === 0) {
                    alert('No entries generated. Check your date range.');
                    return;
                }
                const assignment = {
                    id: generateId(),
                    preset: schedulePattern,
                    start: scheduleStart,
                    end: scheduleEnd,
                    children: [...children],
                    eowDay: scheduleEOWDay,
                    midweek: scheduleMidweekDow,
                    ...(schedulePattern === 'eow' || schedulePattern === 'eow-midweek'
                        ? { secondary: scheduleSecondaryParent }
                        : { p1: scheduleJointParent1, p2: scheduleJointParent2 }),
                };
                const taggedEntries = newEntries.map(entry => ({ ...entry, scheduleId: assignment.id }));
                const replace = window.confirm(`Generated ${newEntries.length} entries.\n\nOK = Replace all existing entries\nCancel = Add to existing entries`);
                setEntries(replace ? taggedEntries : [...entries, ...taggedEntries]);
                setScheduleAssignments(replace ? [assignment] : [...scheduleAssignments, assignment]);
                setShowScheduleGen(false);
            };

            const exportToExcel = () => {
                try {
                    const wb = XLSX.utils.book_new();

                    // Sheet 1: Custody Entries
                    const entriesData = entries.map(entry => {
                        const row = {
                            'Parent': entry.parent,
                            'Begin Date': entry.beginDate,
                            'End Date': entry.endDate,
                            'Custody Days': daysInclusive(entry.beginDate, entry.endDate),
                            'Type': entry.isException ? 'Holiday' : 'Schedule',
                            'Where': resolveLocation(entry, parentLocations),
                            'Exchange Time': entry.exchangeTime || '',
                            'Exchange Place': entry.exchangePlace || '',
                        };

                        // Add each child as a column
                        children.forEach(child => {
                            row[child] = entry.childrenPresent[child] ? 'Yes' : 'No';
                        });

                        row['Note'] = entry.note;
                        return row;
                    });

                    const ws1 = XLSX.utils.json_to_sheet(entriesData);
                    const colWidths = [
                        { wch: 14 }, // Parent
                        { wch: 14 }, // Begin Date
                        { wch: 14 }, // End Date
                        { wch: 16 }, // Custody Days
                        { wch: 10 }, // Type
                        { wch: 28 }, // Where
                        { wch: 14 }, // Exchange Time
                        { wch: 18 }, // Exchange Place
                    ];
                    children.forEach(() => colWidths.push({ wch: 10 })); // Child columns
                    colWidths.push({ wch: 30 }); // Note
                    ws1['!cols'] = colWidths;
                    XLSX.utils.book_append_sheet(wb, ws1, 'Custody Entries');

                    // Sheet 2: Summary (Filtered)
                    const childAnalysisText = analysisChild === 'all' ? 'All Children' : analysisChild;
                    const summaryTitle = reportingWindow.start && reportingWindow.end 
                        ? `Summary for ${reportingWindow.start} to ${reportingWindow.end} (${childAnalysisText})`
                        : '(no window set)';

                    const summaryData = [
                        ['', '', '', ''],
                        ['Parent', 'Custody Days', '% Custody Days'],
                        ...windowSummary.map(item => [
                            item.parent,
                            item.custodyDays,
                            `${item.percentage}%`
                        ])
                    ];

                    const ws2 = XLSX.utils.aoa_to_sheet(summaryData);
                    ws2['A1'] = { v: summaryTitle };
                    ws2['!cols'] = [
                        { wch: 18 },
                        { wch: 10 },
                        { wch: 10 },
                        { wch: 22 }
                    ];
                    XLSX.utils.book_append_sheet(wb, ws2, 'Summary (Filtered)');

                    // Export
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                    const blob = new Blob([wbout], { 
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' 
                    });
                    
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Custody_Calendar_${todayStr}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('Export failed:', error);
                    alert('Export failed. Please ensure you have an internet connection.');
                }
            };

            // Share the schedule as a calendar file the kids can add to Apple/Google Calendar.
            const exportICS = () => {
                try {
                    if (parents.length === 0) {
                        alert('Add parents and a schedule first.');
                        return;
                    }
                    // Use the reporting window when it is set, otherwise the next 12 months.
                    let start = reportingWindow.start;
                    let end = reportingWindow.end;
                    if (!start || !end) {
                        start = localTodayStr();
                        const in12 = toDate(start);
                        in12.setFullYear(in12.getFullYear() + 1);
                        end = `${in12.getFullYear()}-${pad2(in12.getMonth() + 1)}-${pad2(in12.getDate())}`;
                    }

                    const singleChild = analysisChild !== 'all';
                    const blocks = buildCustodyBlocks({
                        entries, parents, children, start, end, childFilter: analysisChild,
                    });
                    if (blocks.length === 0) {
                        alert('No custody days fall in this date range.');
                        return;
                    }

                    const who = singleChild ? analysisChild : (children.length ? children.join(' & ') : 'Custody');
                    const ics = buildICS({
                        blocks, parentLocations,
                        calendarName: `${who} — Custody Schedule`,
                        singleChild,
                    });

                    const safe = who.replace(/[^A-Za-z0-9]+/g, '_');
                    const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Custody_${safe}_${start}_to_${end}.ics`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('Calendar export failed:', error);
                    alert('Calendar export failed.');
                }
            };

            // Send the kids a standalone page they can open on their own device.
            const exportKidPage = () => {
                try {
                    if (parents.length === 0) { alert('Add parents and a schedule first.'); return; }
                    const from = localTodayStr();
                    let to = reportingWindow.end;
                    if (!to || to <= from) {
                        const d = toDate(from);
                        d.setFullYear(d.getFullYear() + 1);
                        to = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
                    }
                    const html = buildKidPage({
                        entries, parents, children, parentColors, parentLocations, parentPhones,
                        validFrom: from, validTo: to, generatedOn: from,
                    });
                    const safe = (children.length ? children.join('_') : 'Schedule').replace(/[^A-Za-z0-9]+/g, '_');
                    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${safe}_Schedule.html`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('Kid page export failed:', error);
                    alert('Could not create the schedule page.');
                }
            };

            const exportToCSV = () => {
                try {
                    // Prepare entries headers (dynamic based on children)
                    const entriesHeaders = ['Parent', 'Begin Date', 'End Date', 'Custody Days', 'Type', 'Where', 'Exchange Time', 'Exchange Place', ...children, 'Note'];
                    const entriesRows = entries.map(entry => {
                        const row = [
                            entry.parent,
                            entry.beginDate,
                            entry.endDate,
                            daysInclusive(entry.beginDate, entry.endDate),
                            entry.isException ? 'Holiday' : 'Schedule',
                            resolveLocation(entry, parentLocations),
                            entry.exchangeTime || '',
                            entry.exchangePlace || '',
                        ];
                        children.forEach(child => {
                            row.push(entry.childrenPresent[child] ? 'Yes' : 'No');
                        });
                        row.push(entry.note);
                        return row;
                    });

                    // Prepare summary data
                    const childAnalysisText = analysisChild === 'all' ? 'All Children' : analysisChild;
                    const summaryTitle = reportingWindow.start && reportingWindow.end 
                        ? `Summary for ${reportingWindow.start} to ${reportingWindow.end} (${childAnalysisText})`
                        : '(no window set)';

                    const summaryHeaders = ['Parent', 'Custody Days', '% Custody Days'];
                    const summaryRows = windowSummary.map(item => [
                        item.parent,
                        item.custodyDays,
                        `${item.percentage}%`
                    ]);

                    // Helper function to escape CSV fields
                    function escapeCSVField(field) {
                        if (field === null || field === undefined) return '';
                        const str = String(field);
                        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                            return '"' + str.replace(/"/g, '""') + '"';
                        }
                        return str;
                    }

                    // Convert arrays to CSV format
                    function arrayToCSV(headers, rows) {
                        const headerLine = headers.map(escapeCSVField).join(',');
                        const dataLines = rows.map(row => row.map(escapeCSVField).join(','));
                        return [headerLine, ...dataLines].join('\n');
                    }

                    // Create CSV content
                    let csvContent = '# CUSTODY CALENDAR EXPORT\n';
                    csvContent += `# Generated: ${new Date().toLocaleString()}\n\n`;
                    
                    csvContent += '# CUSTODY ENTRIES\n';
                    csvContent += arrayToCSV(entriesHeaders, entriesRows);
                    
                    csvContent += '\n\n# SUMMARY REPORT\n';
                    csvContent += `# ${summaryTitle}\n`;
                    if (summaryRows.length > 0) {
                        csvContent += arrayToCSV(summaryHeaders, summaryRows);
                    } else {
                        csvContent += 'No data for selected window\n';
                    }

                    // Create and download file
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Custody_Calendar_${todayStr}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('CSV Export failed:', error);
                    alert('CSV Export failed.');
                }
            };

            const importFromExcel = async (file) => {
                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data);
                    
                    const sheetName = workbook.SheetNames.find(name => 
                        name.toLowerCase().includes('custody') || 
                        name.toLowerCase().includes('entries') ||
                        name === workbook.SheetNames[0]
                    );
                    
                    if (!sheetName) {
                        throw new Error('No suitable sheet found in the Excel file');
                    }

                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonData.length === 0) {
                        throw new Error('No data found in the Excel sheet');
                    }

                    // Detect children from column headers
                    const firstRow = jsonData[0];
                    const detectedChildren = [];
                    Object.keys(firstRow).forEach(key => {
                        if (!['Parent', 'Begin Date', 'End Date', 'Custody Days', 'Duration (days)', 'Duration (nights)', 'Type', 'Where', 'Exchange Time', 'Exchange Place', 'Note', 'Notes'].includes(key) &&
                            key.trim() !== '') {
                            detectedChildren.push(key);
                        }
                    });

                    // Map the Excel data to our entry format
                    const importedEntries = jsonData.map((row) => {
                        const getColumnValue = (row, possibleNames) => {
                            for (const name of possibleNames) {
                                if (row[name] !== undefined && row[name] !== null && row[name] !== '') {
                                    return row[name];
                                }
                            }
                            return '';
                        };

                        const parent = getColumnValue(row, ['Parent', 'parent']);
                        const beginDate = getColumnValue(row, ['Begin Date', 'Begin', 'Start Date', 'Start']);
                        const endDate = getColumnValue(row, ['End Date', 'End']);
                        const note = getColumnValue(row, ['Note', 'Notes', 'note', 'notes']) || '';
                        const typeValue = getColumnValue(row, ['Type', 'type']);
                        const isException = String(typeValue).toLowerCase() === 'holiday';
                        const location = getColumnValue(row, ['Where', 'Location', 'where', 'location']) || '';
                        const exchangeTime = getColumnValue(row, ['Exchange Time', 'exchange time']) || '';
                        const exchangePlace = getColumnValue(row, ['Exchange Place', 'exchange place']) || '';

                        // Build childrenPresent object
                        const childrenPresent = {};
                        detectedChildren.forEach(child => {
                            const value = row[child];
                            childrenPresent[child] = value === 'Yes' || value === 'yes' || value === true || value === 1;
                        });

                        const formatExcelDate = (dateValue) => {
                            if (!dateValue) return '';
                            
                            if (typeof dateValue === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                                return dateValue;
                            }
                            
                            if (typeof dateValue === 'number') {
                                const excelDate = XLSX.SSF.parse_date_code(dateValue);
                                if (excelDate) {
                                    const year = excelDate.y;
                                    const month = String(excelDate.m).padStart(2, '0');
                                    const day = String(excelDate.d).padStart(2, '0');
                                    return `${year}-${month}-${day}`;
                                }
                            }
                            
                            try {
                                const date = new Date(dateValue);
                                if (!isNaN(date.getTime())) {
                                    return formatDate(date);
                                }
                            } catch (e) {
                                console.warn('Could not parse date:', dateValue);
                            }
                            
                            return '';
                        };

                        return {
                            id: generateId(),
                            parent: String(parent || (parents[0] || '')),
                            beginDate: formatExcelDate(beginDate),
                            endDate: formatExcelDate(endDate),
                            childrenPresent: childrenPresent,
                            note: String(note),
                            isException: isException,
                            location: String(location),
                            exchangeTime: String(exchangeTime),
                            exchangePlace: String(exchangePlace)
                        };
                    }).filter(entry => 
                        entry.parent && (entry.beginDate || entry.endDate)
                    );

                    if (importedEntries.length === 0) {
                        throw new Error('No valid entries found in the Excel file');
                    }

                    // Update children list if new ones detected
                    const newChildren = detectedChildren.filter(c => !children.includes(c));
                    if (newChildren.length > 0) {
                        const addNewChildren = window.confirm(
                            `Found ${newChildren.length} new children in the file: ${newChildren.join(', ')}\n\n` +
                            'Add these children to your calendar?'
                        );
                        if (addNewChildren) {
                            setChildren([...children, ...newChildren]);
                        }
                    }

                    // Ask user if they want to replace or append
                    const replace = window.confirm(
                        `Found ${importedEntries.length} entries in the Excel file.\n\n` +
                        'Click "OK" to REPLACE all current entries.\n' +
                        'Click "Cancel" to ADD to current entries.'
                    );

                    if (replace) {
                        setEntries(importedEntries);
                    } else {
                        setEntries([...entries, ...importedEntries]);
                    }

                    alert(`Successfully imported ${importedEntries.length} entries!`);

                } catch (error) {
                    console.error('Import failed:', error);
                    alert(`Import failed: ${error.message}`);
                }
            };

                const file = event.target.files[0];
                if (file) {

                event.target.value = '';

                                    <input
                                        type="radio"
                                        value="preset"
                                        checked={reportingMode === 'preset'}
                                        onChange={(e) => setReportingMode(e.target.value)}
                                        style={{marginRight: '0.5rem'}}
                                    />
                                    Preset
                                </label>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-4">
                                {reportingMode === 'custom' && (
                                    <>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Start Date</label>
                                            <input
                                                type="date"
                                                value={customStart}
                                                onChange={(e) => setCustomStart(e.target.value)}
                                                className="form-input"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>End Date</label>
                                            <input
                                                type="date"
                                                value={customEnd}
                                                onChange={(e) => setCustomEnd(e.target.value)}
                                                className="form-input"
                                            />
                                        </div>
                                    </>
                                )}

                                {reportingMode === 'quarter' && (
                                    <>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Year</label>
                                            <select
                                                value={quarterYear}
                                                onChange={(e) => setQuarterYear(parseInt(e.target.value))}
                                                className="form-input"
                                            >
                                                {yearOptions.map(year => (
                                                    <option key={year} value={year}>{year}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Quarter</label>
                                            <select
                                                value={quarter}
                                                onChange={(e) => setQuarter(e.target.value)}
                                                className="form-input"
                                            >
                                                <option value="Q1">Q1 (Jan–Mar)</option>
                                                <option value="Q2">Q2 (Apr–Jun)</option>
                                                <option value="Q3">Q3 (Jul–Sep)</option>
                                                <option value="Q4">Q4 (Oct–Dec)</option>
                                            </select>
                                        </div>
                                    </>
                                )}

                                {reportingMode === 'preset' && (
                                    <div>
                                        <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Preset</label>
                                        <select
                                            value={preset}
                                            onChange={(e) => setPreset(e.target.value)}
                                            className="form-input"
                                        >
                                            <option value="year-to-date">Year-to-Date</option>
                                            <option value="last-12-months">Last 12 Months</option>
                                            <option value="calendar-year">Calendar Year (current year)</option>
                                        </select>
                                    </div>
                                )}

                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Analysis</label>
                                    <select
                                        value={analysisChild}
                                        onChange={(e) => setAnalysisChild(e.target.value)}
                                        className="form-input"
                                    >
                                        <option value="all">All Children</option>
                                        {children.map(child => (
                                            <option key={child} value={child}>{child} Only</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="text-sm text-gray-600 mb-2">
                                <strong>Window:</strong> {reportingWindow.start || 'Not set'} to {reportingWindow.end || 'Not set'}
                            </div>
                            <div className="text-sm text-gray-600 mb-2">
                                <strong>Analysis:</strong> {analysisChild === 'all' ? 'All Children' : `${analysisChild} Only`}
                            </div>
                            <div className="text-sm text-gray-600">
                                <strong>{analysisChild === 'all' ? 'Counted child-days' : 'Counted custody days'}:</strong> {summaryResult.totalUnits}
                            </div>
                            {summaryResult.conflictDays > 0 && (
                                <p style={{ fontSize: '0.8rem', color: '#dc2626', marginTop: '0.5rem' }}>{summaryResult.conflictDays} conflicting child-day(s) excluded from this report.</p>
                            )}

                            {/* Summary by Parent */}
                            {windowSummary.length > 0 && (
                                <div className="mt-4">
                                    <h4 className="font-medium text-gray-900 mb-2">Summary by Parent</h4>
                                    <div className="overflow-x-auto">
                                        <table className="table">
                                            <thead>
                                                <tr>
                                                    <th>Parent</th>
                                                    <th>Custody days</th>
                                                    <th>Share</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {windowSummary.map((item, index) => (
                                                    <tr key={index}>
                                                        <td>{item.parent}</td>
                                                        <td>{item.custodyDays}</td>
                                                        <td>{item.percentage}%</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                            </>}
                        </div>

                        {/* Entry Grid */}
                        <div className="overflow-x-auto">
                            <table className="table">
                                <thead>
                                    <tr>
                                        <th>Parent</th>
                                        <th>Date Range</th>
                                        <th>Custody days</th>
                                        {children.map(child => (
                                            <th key={child}>{child}</th>
                                        ))}
                                        <th title="Holiday / exception (overrides schedule)">🎁</th>
                                        <th>Where</th>
                                        <th>Exchange</th>
                                        <th>Note</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {entries.map((entry) => {
                                        const days = daysInclusive(entry.beginDate, entry.endDate);
                                        const isInvalid = entry.beginDate && entry.endDate && days === "";

                                        return (
                                            <tr key={entry.id}>
                                                <td>
                                                    <input
                                                        type="text"
                                                        list="parents"
                                                        value={entry.parent}
                                                        onChange={(e) => updateEntry(entry.id, 'parent', e.target.value)}
                                                        className="form-input"
                                                        autoComplete="off"
                                                    />
                                                    <datalist id="parents">
                                                        {parents.map(parent => (
                                                            <option key={parent} value={parent} />
                                                        ))}
                                                    </datalist>
                                                </td>
                                                <td style={{minWidth: '180px'}}>
                                                    <DateRangePicker
                                                        beginDate={entry.beginDate}
                                                        endDate={entry.endDate}
                                                        onChangeDates={(begin, end) => updateDateRange(entry.id, begin, end)}
                                                    />
                                                </td>
                                                <td className={isInvalid ? 'text-red' : ''}>
                                                    {days}
                                                </td>
                                                {children.map(child => (
                                                    <td key={child}>
                                                        <input
                                                            type="checkbox"
                                                            checked={entry.childrenPresent[child] || false}
                                                            onChange={(e) => updateChildPresent(entry.id, child, e.target.checked)}
                                                            aria-label={`${child} is included in this entry`}
                                                            className="w-5 h-5 checkbox"
                                                        />
                                                    </td>
                                                ))}
                                                <td>
                                                    <input
                                                        type="checkbox"
                                                        checked={Boolean(entry.isException)}
                                                        onChange={(e) => updateEntry(entry.id, 'isException', e.target.checked)}
                                                        aria-label="Holiday / exception overrides the schedule"
                                                        className="w-5 h-5 checkbox"
                                                    />
                                                </td>
                                                <td style={{minWidth: '150px'}}>
                                                    <input
                                                        type="text"
                                                        value={entry.location || ''}
                                                        onChange={(e) => updateEntry(entry.id, 'location', e.target.value)}
                                                        className="form-input"
                                                        placeholder={entry.parent && parentLocations[entry.parent] ? parentLocations[entry.parent] : "Parent's home"}
                                                        aria-label="Where the child stays"
                                                    />
                                                </td>
                                                <td style={{minWidth: '170px'}}>
                                                    <div className="flex gap-2">
                                                        <input
                                                            type="text"
                                                            value={entry.exchangeTime || ''}
                                                            onChange={(e) => updateEntry(entry.id, 'exchangeTime', e.target.value)}
                                                            className="form-input"
                                                            placeholder="6:00 PM"
                                                            aria-label="Exchange time"
                                                        />
                                                        <input
                                                            type="text"
                                                            value={entry.exchangePlace || ''}
                                                            onChange={(e) => updateEntry(entry.id, 'exchangePlace', e.target.value)}
                                                            className="form-input"
                                                            placeholder="School"
                                                            aria-label="Exchange place"
                                                        />
                                                    </div>
                                                </td>
                                                <td>
                                                    <input
                                                        type="text"
                                                        value={entry.note}
                                                        onChange={(e) => updateEntry(entry.id, 'note', e.target.value)}
                                                        className="form-input"
                                                    />
                                                </td>
                                                <td>
                                                    <button
                                                        onClick={() => removeRow(entry.id)}
                                                        disabled={entries.length === 1}
                                                        className={entries.length === 1 ? 'text-gray-400 cursor-not-allowed' : 'text-red'}
                                                        style={{
                                                            padding: '0.25rem 0.5rem',
                                                            border: 'none',
                                                            background: 'none',
                                                            cursor: entries.length === 1 ? 'not-allowed' : 'pointer',
                                                            fontSize: '1.2rem'
                                                        }}
                                                        title="Delete row"
                                                    >
                                                        🗑️
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {/* Footer Totals */}
                        <div className="mt-6" style={{padding: '1rem', backgroundColor: '#f9fafb', borderRadius: '0.5rem'}}>
                            <div className="flex" style={{justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem'}}>
                                <span className="font-semibold">Entered custody days: {footerTotals.totalDays}</span>
                            </div>
                        </div>

                    </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CustodyCalendarApp />);
    </script>
</body>
</html>
