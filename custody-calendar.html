                setChildColors(wcc);
                setEntries(we);
                setShowWizard(false);
                setViewMode('calendar');
            };
            const [showConfig, setShowConfig] = useState(true);
            const [showReporting, setShowReporting] = useState(false);
            const [newParentName, setNewParentName] = useState('');
            const [newChildName, setNewChildName] = useState('');

            const [entries, setEntries] = useState([
                {
                    id: generateId(),
                    parent: '',
                    beginDate: '',
                    endDate: '',
                    childrenPresent: {},
                    note: ''
                }
            ]);

            const [reportingMode, setReportingMode] = useState('custom');
            const [customStart, setCustomStart] = useState('');
            const [customEnd, setCustomEnd] = useState('');
            const [quarterYear, setQuarterYear] = useState(new Date().getFullYear());
            const [quarter, setQuarter] = useState('Q1');
            const [preset, setPreset] = useState('year-to-date');
            const [analysisChild, setAnalysisChild] = useState('all');

            // Schedule generator state
            const [showScheduleGen, setShowScheduleGen] = useState(false);
            const [schedulePattern, setSchedulePattern] = useState('eow');
            const [scheduleStart, setScheduleStart] = useState('');
            const [scheduleEnd, setScheduleEnd] = useState('');
            const [scheduleSecondaryParent, setScheduleSecondaryParent] = useState('');
            const [scheduleJointParent1, setScheduleJointParent1] = useState('');
            const [scheduleJointParent2, setScheduleJointParent2] = useState('');
            const [scheduleEOWDay, setScheduleEOWDay] = useState('fri');
            const [scheduleMidweekDow, setScheduleMidweekDow] = useState(3); // Wednesday

            const currentYear = new Date().getFullYear();
            const today = new Date();
            const todayStr = formatDate(today);

            // Generate year options
            const yearOptions = [];
            for (let year = currentYear - 5; year <= currentYear + 5; year++) {
                yearOptions.push(year);
            }

            // Configuration functions
            const addParent = () => {
                const name = newParentName.trim();
                if (name && !parents.includes(name)) {
                    setParents([...parents, name]);
                    setParentColors({ ...parentColors, [name]: nextColor(parentColors) });
                    setNewParentName('');
                }
            };

            const removeParent = (parent) => {
                if (parents.length > 1 && window.confirm(`Remove parent "${parent}"? This cannot be undone.`)) {
                    setParents(parents.filter(p => p !== parent));
                    const nc = { ...parentColors }; delete nc[parent]; setParentColors(nc);
                }
            };

            const setPrimary = (parent) => {
                setParents([parent, ...parents.filter(p => p !== parent)]);
            };

            const setColor = (type, name, color) => {
                if (type === 'parent') setParentColors({ ...parentColors, [name]: color });
                else setChildColors({ ...childColors, [name]: color });
                setEditingColor(null);
            };

            const addChild = () => {
                if (newChildName.trim() && !children.includes(newChildName.trim())) {
                    const childName = newChildName.trim();
                    setChildren([...children, childName]);
                    setChildColors({ ...childColors, [childName]: nextColor(childColors) });

                    // Add this child to all existing entries
                    setEntries(entries.map(entry => ({
                        ...entry,
                        childrenPresent: {
                            ...entry.childrenPresent,
                            [childName]: true
                        }
                    })));

                    setNewChildName('');
                }
            };

            const removeChild = (child) => {
                if (children.length > 1 && window.confirm(`Remove child "${child}"? This cannot be undone.`)) {
                    setChildren(children.filter(c => c !== child));
                    const nc = { ...childColors }; delete nc[child]; setChildColors(nc);

                    // Remove this child from all entries
                    setEntries(entries.map(entry => {
                        const newChildrenPresent = { ...entry.childrenPresent };
                        delete newChildrenPresent[child];
                        return {
                            ...entry,
                            childrenPresent: newChildrenPresent
                        };
                    }));

                    // Reset analysis if it was set to the removed child
                    if (analysisChild === child) {
                        setAnalysisChild('all');
                    }
                }
            };

            // Calculate reporting window
            const reportingWindow = useMemo(() => {
                let start = '';
                let end = '';

                if (reportingMode === 'custom') {
                    start = customStart;
                    end = customEnd;
                } else if (reportingMode === 'quarter') {
                    const quarters = {
                        Q1: { start: `${quarterYear}-01-01`, end: `${quarterYear}-03-31` },
                        Q2: { start: `${quarterYear}-04-01`, end: `${quarterYear}-06-30` },
                        Q3: { start: `${quarterYear}-07-01`, end: `${quarterYear}-09-30` },
                        Q4: { start: `${quarterYear}-10-01`, end: `${quarterYear}-12-31` }
                    };
                    start = quarters[quarter].start;
                    end = quarters[quarter].end;
                } else if (reportingMode === 'preset') {
                    if (preset === 'year-to-date') {
                        start = `${currentYear}-01-01`;
                        end = todayStr;
                    } else if (preset === 'last-12-months') {
                        const startDate = new Date(today);
                        startDate.setFullYear(startDate.getFullYear() - 1);
                        start = formatDate(startDate);
                        end = todayStr;
                    } else if (preset === 'calendar-year') {
                        start = `${currentYear}-01-01`;
                        end = `${currentYear}-12-31`;
                    }
                }

                return { start, end };
            }, [reportingMode, customStart, customEnd, quarterYear, quarter, preset, currentYear, todayStr]);

            // Calculate summary by parent for reporting window
            const windowSummary = useMemo(() => {
                if (!reportingWindow.start || !reportingWindow.end) return [];

                const parentSummary = {};
                
                entries.forEach(entry => {
                    if (!entry.beginDate || !entry.endDate) return;
                    
                    const days = overlapDays(entry.beginDate, entry.endDate, reportingWindow.start, reportingWindow.end);
                    const nights = Math.max(0, days - 1);
                    
                    // Count child-nights based on analysis selection
                    let childNights = 0;
                    if (analysisChild === 'all') {
                        // Count nights for all children present
                        children.forEach(child => {
                            if (entry.childrenPresent[child]) {
                                childNights += nights;
                            }
                        });
                    } else {
                        // Count nights only for the selected child
                        if (entry.childrenPresent[analysisChild]) {
                            childNights = nights;
                        }
                    }
                    
                    if (!parentSummary[entry.parent]) {
                        parentSummary[entry.parent] = { days: 0, nights: 0 };
                    }
                    
                    parentSummary[entry.parent].days += days;
                    parentSummary[entry.parent].nights += childNights;
                });

                // Primary parent gets all nights not explicitly covered by other entries.
                // You only need to enter entries for non-primary custody periods;
                // the primary parent's share is inferred as the remainder.
                const primaryParent = parents[0];
                if (reportingWindow.start && reportingWindow.end && primaryParent) {
                    const windowDays = daysInclusive(reportingWindow.start, reportingWindow.end);
                    const windowNights = windowDays !== "" ? Math.max(0, windowDays - 1) : 0;
                    const totalPossibleNights = analysisChild === 'all'
                        ? windowNights * children.length
                        : windowNights;

                    // Sum ALL explicitly entered nights across all parents
                    const totalExplicitNights = Object.values(parentSummary).reduce((s, d) => s + d.nights, 0);

                    // Gap nights default to primary
                    const gapNights = Math.max(0, totalPossibleNights - totalExplicitNights);
                    if (gapNights > 0) {
                        if (!parentSummary[primaryParent]) {
                            parentSummary[primaryParent] = { days: 0, nights: 0 };
                        }
                        parentSummary[primaryParent].nights += gapNights;
                        parentSummary[primaryParent].days += gapNights;
                    }
                }

                const totalNights = Object.values(parentSummary).reduce((sum, p) => sum + p.nights, 0);
                
                return Object.entries(parentSummary).map(([parent, data]) => ({
                    parent,
                    days: data.days,
                    nights: data.nights,
                    percentage: totalNights > 0 ? ((data.nights / totalNights) * 100).toFixed(1) : '0.0'
                }));
            }, [entries, reportingWindow, analysisChild, children, parents]);

            const totalWindowNights = windowSummary.reduce((sum, p) => sum + p.nights, 0);

            // Calculate footer totals
            const footerTotals = useMemo(() => {
                let totalDays = 0;
                let totalNights = 0;
                
                entries.forEach(entry => {
                    const days = daysInclusive(entry.beginDate, entry.endDate);
                    const nights = nightsInclusive(entry.beginDate, entry.endDate);
                    
                    if (days !== "") {
                        totalDays += days;
                        totalNights += nights;
                    }
                });
                
                return { totalDays, totalNights };
            }, [entries]);

            const addRow = () => {
                const newChildrenPresent = {};
                children.forEach(child => {
                    newChildrenPresent[child] = true;
                });
                
                setEntries([...entries, {
                    id: generateId(),
                    parent: '',
                    beginDate: '',
                    endDate: '',
                    childrenPresent: newChildrenPresent,
                    note: ''
                }]);
            };

            const createEntryFromCalendar = (start, end, parent, childFilter) => {
                const newChildrenPresent = {};
                children.forEach(child => { newChildrenPresent[child] = childFilter ? child === childFilter : true; });
                setEntries([...entries, {
                    id: generateId(),
                    parent,
                    beginDate: start,
                    endDate: end,
                    childrenPresent: newChildrenPresent,
                    note: ''
                }]);
            };

            const removeRow = (id) => {
                if (entries.length > 1) {
                    setEntries(entries.filter(entry => entry.id !== id));
                }
            };

            const updateEntry = (id, field, value) => {
                setEntries(entries.map(entry =>
                    entry.id === id ? { ...entry, [field]: value } : entry
                ));
            };

            const updateDateRange = (id, begin, end) => {
                setEntries(entries.map(entry =>
                    entry.id === id ? { ...entry, beginDate: begin, endDate: end } : entry
                ));
            };

            const updateChildPresent = (id, child, value) => {
                setEntries(entries.map(entry => {
                    if (entry.id === id) {
                        return {
                            ...entry,
                            childrenPresent: {
                                ...entry.childrenPresent,
                                [child]: value
                            }
                        };
                    }
                    return entry;
                }));
            };

            const clearAll = () => {
                if (window.confirm('Clear all entries? This cannot be undone.')) {
                    const newChildrenPresent = {};
                    children.forEach(child => {
                        newChildrenPresent[child] = true;
                    });
                    
                    setEntries([{
                        id: generateId(),
                        parent: '',
                        beginDate: '',
                        endDate: '',
                        childrenPresent: newChildrenPresent,
                        note: ''
                    }]);
                }
            };

            const runScheduleGenerator = () => {
                let newEntries = [];
                if (schedulePattern === 'eow' || schedulePattern === 'eow-midweek') {
                    if (!scheduleSecondaryParent || !scheduleStart || !scheduleEnd) {
                        alert('Please select a parent and set a date range.');
                        return;
                    }
                    newEntries = schedulePattern === 'eow'
                        ? generateEOWSchedule(scheduleSecondaryParent, scheduleStart, scheduleEnd, children, scheduleEOWDay)
                        : generateEOWMidweek(scheduleSecondaryParent, scheduleStart, scheduleEnd, children, scheduleEOWDay, scheduleMidweekDow);
                } else {
                    if (!scheduleJointParent1 || !scheduleJointParent2 || !scheduleStart || !scheduleEnd) {
                        alert('Please select both parents and set a date range.');
                        return;
                    }
                    newEntries = schedulePattern === '2-2-3'
                        ? generate223(scheduleJointParent1, scheduleJointParent2, scheduleStart, scheduleEnd, children)
                        : generateJointWeeklySchedule(scheduleJointParent1, scheduleJointParent2, scheduleStart, scheduleEnd, children);
                }
                if (newEntries.length === 0) {
                    alert('No entries generated. Check your date range.');
                    return;
                }
                const replace = window.confirm(`Generated ${newEntries.length} entries.\n\nOK = Replace all existing entries\nCancel = Add to existing entries`);
                setEntries(replace ? newEntries : [...entries, ...newEntries]);
                setShowScheduleGen(false);
            };

            const exportToExcel = () => {
                try {
                    const wb = XLSX.utils.book_new();

                    // Sheet 1: Custody Entries
                    const entriesData = entries.map(entry => {
                        const row = {
                            'Parent': entry.parent,
                            'Begin Date': entry.beginDate,
                            'End Date': entry.endDate,
                            'Duration (days)': daysInclusive(entry.beginDate, entry.endDate),
                            'Duration (nights)': nightsInclusive(entry.beginDate, entry.endDate),
                        };
                        
                        // Add each child as a column
                        children.forEach(child => {
                            row[child] = entry.childrenPresent[child] ? 'Yes' : 'No';
                        });
                        
                        row['Note'] = entry.note;
                        return row;
                    });

                    const ws1 = XLSX.utils.json_to_sheet(entriesData);
                    const colWidths = [
                        { wch: 14 }, // Parent
                        { wch: 14 }, // Begin Date
                        { wch: 14 }, // End Date
                        { wch: 16 }, // Duration (days)
                        { wch: 18 }, // Duration (nights)
                    ];
                    children.forEach(() => colWidths.push({ wch: 10 })); // Child columns
                    colWidths.push({ wch: 30 }); // Note
                    ws1['!cols'] = colWidths;
                    XLSX.utils.book_append_sheet(wb, ws1, 'Custody Entries');

                    // Sheet 2: Summary (Filtered)
                    const childAnalysisText = analysisChild === 'all' ? 'All Children' : analysisChild;
                    const summaryTitle = reportingWindow.start && reportingWindow.end 
                        ? `Summary for ${reportingWindow.start} to ${reportingWindow.end} (${childAnalysisText})`
                        : '(no window set)';

                    const summaryData = [
                        ['', '', '', ''],
                        ['Parent', 'Days', 'Nights', '% Nights (of window total)'],
                        ...windowSummary.map(item => [
                            item.parent,
                            item.days,
                            item.nights,
                            `${item.percentage}%`
                        ])
                    ];

                    const ws2 = XLSX.utils.aoa_to_sheet(summaryData);
                    ws2['A1'] = { v: summaryTitle };
                    ws2['!cols'] = [
                        { wch: 18 },
                        { wch: 10 },
                        { wch: 10 },
                        { wch: 22 }
                    ];
                    XLSX.utils.book_append_sheet(wb, ws2, 'Summary (Filtered)');

                    // Export
                    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                    const blob = new Blob([wbout], { 
                        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' 
                    });
                    
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Custody_Calendar_${todayStr}.xlsx`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('Export failed:', error);
                    alert('Export failed. Please ensure you have an internet connection.');
                }
            };

            const exportToCSV = () => {
                try {
                    // Prepare entries headers (dynamic based on children)
                    const entriesHeaders = ['Parent', 'Begin Date', 'End Date', 'Duration (days)', 'Duration (nights)', ...children, 'Note'];
                    const entriesRows = entries.map(entry => {
                        const row = [
                            entry.parent,
                            entry.beginDate,
                            entry.endDate,
                            daysInclusive(entry.beginDate, entry.endDate),
                            nightsInclusive(entry.beginDate, entry.endDate),
                        ];
                        children.forEach(child => {
                            row.push(entry.childrenPresent[child] ? 'Yes' : 'No');
                        });
                        row.push(entry.note);
                        return row;
                    });

                    // Prepare summary data
                    const childAnalysisText = analysisChild === 'all' ? 'All Children' : analysisChild;
                    const summaryTitle = reportingWindow.start && reportingWindow.end 
                        ? `Summary for ${reportingWindow.start} to ${reportingWindow.end} (${childAnalysisText})`
                        : '(no window set)';

                    const summaryHeaders = ['Parent', 'Days', 'Nights', '% Nights (of window total)'];
                    const summaryRows = windowSummary.map(item => [
                        item.parent,
                        item.days,
                        item.nights,
                        `${item.percentage}%`
                    ]);

                    // Helper function to escape CSV fields
                    function escapeCSVField(field) {
                        if (field === null || field === undefined) return '';
                        const str = String(field);
                        if (str.includes(',') || str.includes('"') || str.includes('\n') || str.includes('\r')) {
                            return '"' + str.replace(/"/g, '""') + '"';
                        }
                        return str;
                    }

                    // Convert arrays to CSV format
                    function arrayToCSV(headers, rows) {
                        const headerLine = headers.map(escapeCSVField).join(',');
                        const dataLines = rows.map(row => row.map(escapeCSVField).join(','));
                        return [headerLine, ...dataLines].join('\n');
                    }

                    // Create CSV content
                    let csvContent = '# CUSTODY CALENDAR EXPORT\n';
                    csvContent += `# Generated: ${new Date().toLocaleString()}\n\n`;
                    
                    csvContent += '# CUSTODY ENTRIES\n';
                    csvContent += arrayToCSV(entriesHeaders, entriesRows);
                    
                    csvContent += '\n\n# SUMMARY REPORT\n';
                    csvContent += `# ${summaryTitle}\n`;
                    if (summaryRows.length > 0) {
                        csvContent += arrayToCSV(summaryHeaders, summaryRows);
                    } else {
                        csvContent += 'No data for selected window\n';
                    }

                    // Create and download file
                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Custody_Calendar_${todayStr}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                } catch (error) {
                    console.error('CSV Export failed:', error);
                    alert('CSV Export failed.');
                }
            };

            const importFromExcel = async (file) => {
                try {
                    const data = await file.arrayBuffer();
                    const workbook = XLSX.read(data);
                    
                    const sheetName = workbook.SheetNames.find(name => 
                        name.toLowerCase().includes('custody') || 
                        name.toLowerCase().includes('entries') ||
                        name === workbook.SheetNames[0]
                    );
                    
                    if (!sheetName) {
                        throw new Error('No suitable sheet found in the Excel file');
                    }

                    const worksheet = workbook.Sheets[sheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonData.length === 0) {
                        throw new Error('No data found in the Excel sheet');
                    }

                    // Detect children from column headers
                    const firstRow = jsonData[0];
                    const detectedChildren = [];
                    Object.keys(firstRow).forEach(key => {
                        if (!['Parent', 'Begin Date', 'End Date', 'Duration (days)', 'Duration (nights)', 'Note', 'Notes'].includes(key) &&
                            key.trim() !== '') {
                            detectedChildren.push(key);
                        }
                    });

                    // Map the Excel data to our entry format
                    const importedEntries = jsonData.map((row) => {
                        const getColumnValue = (row, possibleNames) => {
                            for (const name of possibleNames) {
                                if (row[name] !== undefined && row[name] !== null && row[name] !== '') {
                                    return row[name];
                                }
                            }
                            return '';
                        };

                        const parent = getColumnValue(row, ['Parent', 'parent']);
                        const beginDate = getColumnValue(row, ['Begin Date', 'Begin', 'Start Date', 'Start']);
                        const endDate = getColumnValue(row, ['End Date', 'End']);
                        const note = getColumnValue(row, ['Note', 'Notes', 'note', 'notes']) || '';
                        
                        // Build childrenPresent object
                        const childrenPresent = {};
                        detectedChildren.forEach(child => {
                            const value = row[child];
                            childrenPresent[child] = value === 'Yes' || value === 'yes' || value === true || value === 1;
                        });

                        const formatExcelDate = (dateValue) => {
                            if (!dateValue) return '';
                            
                            if (typeof dateValue === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(dateValue)) {
                                return dateValue;
                            }
                            
                            if (typeof dateValue === 'number') {
                                const excelDate = XLSX.SSF.parse_date_code(dateValue);
                                if (excelDate) {
                                    const year = excelDate.y;
                                    const month = String(excelDate.m).padStart(2, '0');
                                    const day = String(excelDate.d).padStart(2, '0');
                                    return `${year}-${month}-${day}`;
                                }
                            }
                            
                            try {
                                const date = new Date(dateValue);
                                if (!isNaN(date.getTime())) {
                                    return formatDate(date);
                                }
                            } catch (e) {
                                console.warn('Could not parse date:', dateValue);
                            }
                            
                            return '';
                        };

                        return {
                            id: generateId(),
                            parent: String(parent || (parents[0] || '')),
                            beginDate: formatExcelDate(beginDate),
                            endDate: formatExcelDate(endDate),
                            childrenPresent: childrenPresent,
                            note: String(note)
                        };
                    }).filter(entry => 
                        entry.parent && (entry.beginDate || entry.endDate)
                    );

                    if (importedEntries.length === 0) {
                        throw new Error('No valid entries found in the Excel file');
                    }

                    // Update children list if new ones detected
                    const newChildren = detectedChildren.filter(c => !children.includes(c));
                    if (newChildren.length > 0) {
                        const addNewChildren = window.confirm(
                            `Found ${newChildren.length} new children in the file: ${newChildren.join(', ')}\n\n` +
                            'Add these children to your calendar?'
                        );
                        if (addNewChildren) {
                            setChildren([...children, ...newChildren]);
                        }
                    }

                    // Ask user if they want to replace or append
                    const replace = window.confirm(
                        `Found ${importedEntries.length} entries in the Excel file.\n\n` +
                        'Click "OK" to REPLACE all current entries.\n' +
                        'Click "Cancel" to ADD to current entries.'
                    );

                    if (replace) {
                        setEntries(importedEntries);
                    } else {
                        setEntries([...entries, ...importedEntries]);
                    }

                    alert(`Successfully imported ${importedEntries.length} entries!`);

                } catch (error) {
                    console.error('Import failed:', error);
                    alert(`Import failed: ${error.message}`);
                }
            };

            const handleFileImport = (event) => {
                const file = event.target.files[0];
                if (file) {
                    importFromExcel(file);
                }
                event.target.value = '';
            };

            return (
                <div className="container">
                    {showWizard && <SetupWizard onComplete={completeWizard} onCancel={() => setShowWizard(false)} />}
                    <div style={{
                        background: '#fef3c7',
                        border: '1px solid #f59e0b',
                        borderRadius: '0.5rem',
                        padding: '0.75rem 1rem',
                        marginBottom: '1rem',
                        display: 'flex',
                        alignItems: 'flex-start',
                        gap: '0.6rem'
                    }}>
                        <span style={{fontSize: '1.2rem', lineHeight: 1}}>⚠️</span>
                        <div style={{fontSize: '0.875rem', color: '#92400e'}}>
                            <strong>Data is not saved automatically.</strong> This is a self-contained webpage — all data lives only in your browser session and will be permanently lost if you refresh or close this tab. <strong>Export your data before refreshing.</strong>
                        </div>
                    </div>
                    <div className="card">
                        <h1 style={{fontSize: '1.5rem', fontWeight: 'bold', color: '#111827', marginBottom: '1rem'}}>
                            Custody Calendar - {children.join(' & ')}
                        </h1>

                        {/* View toggle */}
                        <div style={{display: 'flex', background: '#e5e7eb', borderRadius: '10px', padding: '3px'}}>
                            {[{id: 'list', label: 'Entries'}, {id: 'calendar', label: 'Calendar'}].map(m => (
                                <button key={m.id} onClick={() => setViewMode(m.id)} style={{
                                    flex: 1, padding: '0.5rem', borderRadius: '8px', border: 'none', cursor: 'pointer',
                                    fontSize: '0.9rem',
                                    fontWeight: viewMode === m.id ? 700 : 500,
                                    background: viewMode === m.id ? '#fff' : 'transparent',
                                    color: viewMode === m.id ? '#111827' : '#6b7280',
                                    boxShadow: viewMode === m.id ? '0 1px 2px rgba(0,0,0,0.1)' : 'none'
                                }}>{m.label}</button>
                            ))}
                        </div>
                    </div>

                    {viewMode === 'calendar' ? (
                        <CalendarView entries={entries} parents={parents} parentColors={parentColors} children={children} childColors={childColors} onCreateEntry={createEntryFromCalendar} />
                    ) : (
                    <div className="card">
                        {/* Configuration Section */}
                        <div className="config-box mb-6">
                            <div className="flex" style={{justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem'}}>
                                <div>
                                    <h3 className="text-lg font-semibold">Configuration</h3>
                                    {!showConfig && (parents.length === 0 || children.length === 0) && (
                                        <p style={{fontSize: '0.8rem', color: '#b45309', marginTop: '0.2rem'}}>
                                            ⚠ Add parents and children here before entering dates.
                                        </p>
                                    )}
                                    {showConfig && (
                                        <p style={{fontSize: '0.8rem', color: '#6b7280', marginTop: '0.2rem'}}>
                                            Set up parents and children first, then enter custody dates below.
                                        </p>
                                    )}
                                </div>
                                <button
                                    onClick={() => setShowConfig(!showConfig)}
                                    className="btn btn-sm btn-secondary"
                                >
                                    {showConfig ? 'Hide' : 'Show'} Settings
                                </button>
                            </div>
                            
                            {showConfig && (
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {/* Parents Configuration */}
                                    <div>
                                        <h4 className="font-medium text-gray-900 mb-2">Parents</h4>
                                        <div className="config-list mb-2">
                                            {parents.map((parent, index) => (
                                                <div key={parent} className="config-item">
                                                    <button
                                                        onClick={() => setEditingColor(editingColor && editingColor.type === 'parent' && editingColor.name === parent ? null : { type: 'parent', name: parent })}
                                                        title="Change color"
                                                        style={{ width: 18, height: 18, borderRadius: 4, border: '1px solid #d1d5db', background: colorForName(parent, parents, parentColors), cursor: 'pointer', padding: 0 }}
                                                    />
                                                    <span>{parent}{index === 0 ? ' (Primary)' : ''}</span>
                                                    {index !== 0 && (
                                                        <button
                                                            onClick={() => setPrimary(parent)}
                                                            title="Make primary"
                                                            style={{ background: 'none', border: 'none', cursor: 'pointer', padding: '0 0.25rem', fontSize: '1rem', color: '#9ca3af' }}
                                                        >
                                                            ☆
                                                        </button>
                                                    )}
                                                    <button
                                                        onClick={() => removeParent(parent)}
                                                        disabled={parents.length === 1}
                                                        className="text-red"
                                                        style={{
                                                            background: 'none',
                                                            border: 'none',
                                                            cursor: parents.length === 1 ? 'not-allowed' : 'pointer',
                                                            padding: '0 0.25rem',
                                                            fontSize: '1.25rem'
                                                        }}
                                                    >
                                                        ×
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        {editingColor && editingColor.type === 'parent' && (
                                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: '0.75rem', padding: '0.6rem', background: '#fff', border: '1px solid #e5e7eb', borderRadius: 6 }}>
                                                <span style={{ fontSize: '0.8rem', color: '#6b7280', width: '100%' }}>Color for {editingColor.name}:</span>
                                                {COLOR_CHOICES.map(c => (
                                                    <button key={c} onClick={() => setColor('parent', editingColor.name, c)}
                                                        style={{ width: 24, height: 24, borderRadius: '50%', border: colorForName(editingColor.name, parents, parentColors) === c ? '3px solid #111827' : '1px solid #d1d5db', background: c, cursor: 'pointer', padding: 0 }} />
                                                ))}
                                            </div>
                                        )}
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={newParentName}
                                                onChange={(e) => setNewParentName(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && addParent()}
                                                placeholder="New parent name"
                                                className="form-input"
                                            />
                                            <button onClick={addParent} className="btn btn-sm btn-primary">
                                                Add
                                            </button>
                                        </div>
                                    </div>
                                    
                                    {/* Children Configuration */}
                                    <div>
                                        <h4 className="font-medium text-gray-900 mb-2">Children</h4>
                                        <div className="config-list mb-2">
                                            {children.map(child => (
                                                <div key={child} className="config-item">
                                                    <button
                                                        onClick={() => setEditingColor(editingColor && editingColor.type === 'child' && editingColor.name === child ? null : { type: 'child', name: child })}
                                                        title="Change color"
                                                        style={{ width: 18, height: 18, borderRadius: 4, border: '1px solid #d1d5db', background: colorForName(child, children, childColors), cursor: 'pointer', padding: 0 }}
                                                    />
                                                    <span>{child}</span>
                                                    <button
                                                        onClick={() => removeChild(child)}
                                                        disabled={children.length === 1}
                                                        className="text-red"
                                                        style={{
                                                            background: 'none',
                                                            border: 'none',
                                                            cursor: children.length === 1 ? 'not-allowed' : 'pointer',
                                                            padding: '0 0.25rem',
                                                            fontSize: '1.25rem'
                                                        }}
                                                    >
                                                        ×
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                        {editingColor && editingColor.type === 'child' && (
                                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: '0.75rem', padding: '0.6rem', background: '#fff', border: '1px solid #e5e7eb', borderRadius: 6 }}>
                                                <span style={{ fontSize: '0.8rem', color: '#6b7280', width: '100%' }}>Color for {editingColor.name}:</span>
                                                {COLOR_CHOICES.map(c => (
                                                    <button key={c} onClick={() => setColor('child', editingColor.name, c)}
                                                        style={{ width: 24, height: 24, borderRadius: '50%', border: colorForName(editingColor.name, children, childColors) === c ? '3px solid #111827' : '1px solid #d1d5db', background: c, cursor: 'pointer', padding: 0 }} />
                                                ))}
                                            </div>
                                        )}
                                        <div className="flex gap-2">
                                            <input
                                                type="text"
                                                value={newChildName}
                                                onChange={(e) => setNewChildName(e.target.value)}
                                                onKeyPress={(e) => e.key === 'Enter' && addChild()}
                                                placeholder="New child name"
                                                className="form-input"
                                            />
                                            <button onClick={addChild} className="btn btn-sm btn-primary">
                                                Add
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                        
                        {/* Header Actions */}
                        <div className="flex flex-wrap gap-3 mb-6">
                            <button onClick={() => setShowWizard(true)} className="btn btn-secondary">🧭 Setup Wizard</button>
                            <button onClick={addRow} className="btn btn-primary">+ Row</button>
                            <button onClick={() => setShowScheduleGen(!showScheduleGen)} className="btn btn-primary">⚡ Generate Schedule</button>
                            <button onClick={clearAll} className="btn btn-danger">Clear</button>
                            <button onClick={exportToExcel} className="btn btn-success">Export to Excel</button>
                            <button onClick={exportToCSV} className="btn btn-success">Export to CSV</button>
                            <div className="flex items-center">
                                <input
                                    type="file"
                                    accept=".xlsx,.xls"
                                    onChange={handleFileImport}
                                    style={{display: 'none'}}
                                    id="excel-import"
                                />
                                <label htmlFor="excel-import" className="btn btn-primary" style={{margin: 0, cursor: 'pointer'}}>
                                    Import from Excel
                                </label>
                            </div>
                        </div>

                        {/* Schedule Generator */}
                        {showScheduleGen && (
                            <div className="config-box mb-6">
                                <h3 className="text-lg font-semibold mb-4">Generate Schedule</h3>

                                {/* Pattern */}
                                <div className="mb-4">
                                    <label className="font-medium text-gray-700 mb-2" style={{display:'block'}}>Custody Pattern</label>
                                    <div style={{display:'flex', flexDirection:'column', gap:'0.5rem'}}>
                                        {[
                                            {v:'eow', label:'Every Other Weekend (~80/20)'},
                                            {v:'eow-midweek', label:'Every Other Weekend + Midweek (~70/30)'},
                                            {v:'joint-weekly', label:'Alternating Weeks (50/50)'},
                                            {v:'2-2-3', label:'2-2-3 Rotation (50/50)'},
                                        ].map(opt => (
                                            <label key={opt.v} className="flex" style={{alignItems:'center',gap:'0.4rem',cursor:'pointer'}}>
                                                <input type="radio" value={opt.v} checked={schedulePattern===opt.v} onChange={e=>setSchedulePattern(e.target.value)} />
                                                {opt.label}
                                            </label>
                                        ))}
                                    </div>
                                </div>

                                {/* Date range */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                    <div>
                                        <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>Start Date</label>
                                        <input type="date" value={scheduleStart} onChange={e=>setScheduleStart(e.target.value)} className="form-input" />
                                    </div>
                                    <div>
                                        <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>End Date</label>
                                        <input type="date" value={scheduleEnd} onChange={e=>setScheduleEnd(e.target.value)} className="form-input" />
                                    </div>
                                </div>

                                {/* EOW / EOW+midweek options */}
                                {(schedulePattern === 'eow' || schedulePattern === 'eow-midweek') && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>Non-Primary Parent (gets the weekends)</label>
                                            <select value={scheduleSecondaryParent} onChange={e=>setScheduleSecondaryParent(e.target.value)} className="form-input">
                                                <option value="">Select parent…</option>
                                                {parents.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>Weekend Starts On</label>
                                            <select value={scheduleEOWDay} onChange={e=>setScheduleEOWDay(e.target.value)} className="form-input">
                                                <option value="fri">Friday</option>
                                                <option value="sat">Saturday</option>
                                            </select>
                                        </div>
                                        {schedulePattern === 'eow-midweek' && (
                                            <div>
                                                <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>Midweek Overnight</label>
                                                <select value={scheduleMidweekDow} onChange={e=>setScheduleMidweekDow(parseInt(e.target.value))} className="form-input">
                                                    <option value={1}>Monday</option>
                                                    <option value={2}>Tuesday</option>
                                                    <option value={3}>Wednesday</option>
                                                    <option value={4}>Thursday</option>
                                                </select>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {/* Joint weekly / 2-2-3 options */}
                                {(schedulePattern === 'joint-weekly' || schedulePattern === '2-2-3') && (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>{schedulePattern === '2-2-3' ? 'First parent (starts cycle)' : 'Parent with Week 1'}</label>
                                            <select value={scheduleJointParent1} onChange={e=>setScheduleJointParent1(e.target.value)} className="form-input">
                                                <option value="">Select parent…</option>
                                                {parents.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display:'block'}}>{schedulePattern === '2-2-3' ? 'Second parent' : 'Parent with Week 2'}</label>
                                            <select value={scheduleJointParent2} onChange={e=>setScheduleJointParent2(e.target.value)} className="form-input">
                                                <option value="">Select parent…</option>
                                                {parents.map(p => <option key={p} value={p}>{p}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                )}

                                <div className="flex gap-3">
                                    <button onClick={runScheduleGenerator} className="btn btn-success">Generate Entries</button>
                                    <button onClick={() => setShowScheduleGen(false)} className="btn btn-secondary">Cancel</button>
                                </div>
                            </div>
                        )}

                        {/* Reporting Window */}
                        <div className="reporting-box">
                            <div className="flex" style={{justifyContent: 'space-between', alignItems: 'center', marginBottom: showReporting ? '1rem' : 0}}>
                                <h3 className="text-lg font-semibold">Reporting Window & Analysis</h3>
                                <button onClick={() => setShowReporting(!showReporting)} className="btn btn-sm btn-secondary">
                                    {showReporting ? 'Hide' : 'Show'}
                                </button>
                            </div>
                            {showReporting && <>
                            
                            <div className="flex flex-wrap gap-4 mb-4">
                                <label className="flex" style={{alignItems: 'center'}}>
                                    <input
                                        type="radio"
                                        value="custom"
                                        checked={reportingMode === 'custom'}
                                        onChange={(e) => setReportingMode(e.target.value)}
                                        style={{marginRight: '0.5rem'}}
                                    />
                                    Custom Range
                                </label>
                                <label className="flex" style={{alignItems: 'center'}}>
                                    <input
                                        type="radio"
                                        value="quarter"
                                        checked={reportingMode === 'quarter'}
                                        onChange={(e) => setReportingMode(e.target.value)}
                                        style={{marginRight: '0.5rem'}}
                                    />
                                    Quarter
                                </label>
                                <label className="flex" style={{alignItems: 'center'}}>
                                    <input
                                        type="radio"
                                        value="preset"
                                        checked={reportingMode === 'preset'}
                                        onChange={(e) => setReportingMode(e.target.value)}
                                        style={{marginRight: '0.5rem'}}
                                    />
                                    Preset
                                </label>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4 mb-4">
                                {reportingMode === 'custom' && (
                                    <>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Start Date</label>
                                            <input
                                                type="date"
                                                value={customStart}
                                                onChange={(e) => setCustomStart(e.target.value)}
                                                className="form-input"
                                            />
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>End Date</label>
                                            <input
                                                type="date"
                                                value={customEnd}
                                                onChange={(e) => setCustomEnd(e.target.value)}
                                                className="form-input"
                                            />
                                        </div>
                                    </>
                                )}

                                {reportingMode === 'quarter' && (
                                    <>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Year</label>
                                            <select
                                                value={quarterYear}
                                                onChange={(e) => setQuarterYear(parseInt(e.target.value))}
                                                className="form-input"
                                            >
                                                {yearOptions.map(year => (
                                                    <option key={year} value={year}>{year}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Quarter</label>
                                            <select
                                                value={quarter}
                                                onChange={(e) => setQuarter(e.target.value)}
                                                className="form-input"
                                            >
                                                <option value="Q1">Q1 (Jan–Mar)</option>
                                                <option value="Q2">Q2 (Apr–Jun)</option>
                                                <option value="Q3">Q3 (Jul–Sep)</option>
                                                <option value="Q4">Q4 (Oct–Dec)</option>
                                            </select>
                                        </div>
                                    </>
                                )}

                                {reportingMode === 'preset' && (
                                    <div>
                                        <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Preset</label>
                                        <select
                                            value={preset}
                                            onChange={(e) => setPreset(e.target.value)}
                                            className="form-input"
                                        >
                                            <option value="year-to-date">Year-to-Date</option>
                                            <option value="last-12-months">Last 12 Months</option>
                                            <option value="calendar-year">Calendar Year (current year)</option>
                                        </select>
                                    </div>
                                )}

                                <div>
                                    <label className="text-sm font-medium text-gray-700 mb-2" style={{display: 'block'}}>Analysis</label>
                                    <select
                                        value={analysisChild}
                                        onChange={(e) => setAnalysisChild(e.target.value)}
                                        className="form-input"
                                    >
                                        <option value="all">All Children</option>
                                        {children.map(child => (
                                            <option key={child} value={child}>{child} Only</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="text-sm text-gray-600 mb-2">
                                <strong>Window:</strong> {reportingWindow.start || 'Not set'} to {reportingWindow.end || 'Not set'}
                            </div>
                            <div className="text-sm text-gray-600 mb-2">
                                <strong>Analysis:</strong> {analysisChild === 'all' ? 'All Children' : `${analysisChild} Only`}
                            </div>
                            <div className="text-sm text-gray-600">
                                <strong>Total nights in window:</strong> {totalWindowNights}
                            </div>

                            {/* Summary by Parent */}
                            {windowSummary.length > 0 && (
                                <div className="mt-4">
                                    <h4 className="font-medium text-gray-900 mb-2">Summary by Parent</h4>
                                    <div className="overflow-x-auto">
                                        <table className="table">
                                            <thead>
                                                <tr>
                                                    <th>Parent</th>
                                                    <th>Days</th>
                                                    <th>Nights</th>
                                                    <th>% Nights</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {windowSummary.map((item, index) => (
                                                    <tr key={index}>
                                                        <td>{item.parent}</td>
                                                        <td>{item.days}</td>
                                                        <td>{item.nights}</td>
                                                        <td>{item.percentage}%</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}
                            </>}
                        </div>

                        {/* Entry Grid */}
                        <div className="overflow-x-auto">
                            <table className="table">
                                <thead>
                                    <tr>
                                        <th>Parent</th>
                                        <th>Date Range</th>
                                        <th>Days</th>
                                        <th>Nights</th>
                                        {children.map(child => (
                                            <th key={child}>{child}</th>
                                        ))}
                                        <th>Note</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {entries.map((entry) => {
                                        const days = daysInclusive(entry.beginDate, entry.endDate);
                                        const nights = nightsInclusive(entry.beginDate, entry.endDate);
                                        const isInvalid = entry.beginDate && entry.endDate && days === "";

                                        return (
                                            <tr key={entry.id}>
                                                <td>
                                                    <input
                                                        type="text"
                                                        list="parents"
                                                        value={entry.parent}
                                                        onChange={(e) => updateEntry(entry.id, 'parent', e.target.value)}
                                                        className="form-input"
                                                        autoComplete="off"
                                                    />
                                                    <datalist id="parents">
                                                        {parents.map(parent => (
                                                            <option key={parent} value={parent} />
                                                        ))}
                                                    </datalist>
                                                </td>
                                                <td style={{minWidth: '180px'}}>
                                                    <DateRangePicker
                                                        beginDate={entry.beginDate}
                                                        endDate={entry.endDate}
                                                        onChangeDates={(begin, end) => updateDateRange(entry.id, begin, end)}
                                                    />
                                                </td>
                                                <td className={isInvalid ? 'text-red' : ''}>
                                                    {days}
                                                </td>
                                                <td className={isInvalid ? 'text-red' : ''}>
                                                    {nights}
                                                </td>
                                                {children.map(child => (
                                                    <td key={child}>
                                                        <input
                                                            type="checkbox"
                                                            checked={entry.childrenPresent[child] || false}
                                                            onChange={(e) => updateChildPresent(entry.id, child, e.target.checked)}
                                                            className="w-5 h-5 checkbox"
                                                        />
                                                    </td>
                                                ))}
                                                <td>
                                                    <input
                                                        type="text"
                                                        value={entry.note}
                                                        onChange={(e) => updateEntry(entry.id, 'note', e.target.value)}
                                                        className="form-input"
                                                    />
                                                </td>
                                                <td>
                                                    <button
                                                        onClick={() => removeRow(entry.id)}
                                                        disabled={entries.length === 1}
                                                        className={entries.length === 1 ? 'text-gray-400 cursor-not-allowed' : 'text-red'}
                                                        style={{
                                                            padding: '0.25rem 0.5rem',
                                                            border: 'none',
                                                            background: 'none',
                                                            cursor: entries.length === 1 ? 'not-allowed' : 'pointer',
                                                            fontSize: '1.2rem'
                                                        }}
                                                        title="Delete row"
                                                    >
                                                        🗑️
                                                    </button>
                                                </td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>

                        {/* Footer Totals */}
                        <div className="mt-6" style={{padding: '1rem', backgroundColor: '#f9fafb', borderRadius: '0.5rem'}}>
                            <div className="flex" style={{justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: '1rem'}}>
                                <span className="font-semibold">Total Days: {footerTotals.totalDays}</span>
                                <span className="font-semibold">Total Nights: {footerTotals.totalNights}</span>
                            </div>
                        </div>

                    </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CustodyCalendarApp />);
    </script>
</body>
</html>
