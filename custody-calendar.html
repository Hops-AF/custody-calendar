<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        // Date helper functions
        function toDate(d) {
            if (!d || typeof d !== 'string') return null;
            const parsed = new Date(d + 'T00:00:00.000');
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        function daysInclusive(start, end) {
            const startDate = toDate(start);
            const endDate = toDate(end);
            
            if (!startDate || !endDate || endDate < startDate) {
                return "";
            }
            
            const diffTime = endDate.getTime() - startDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays + 1;
        }

        function overlapDays(a0, a1, b0, b1) {
            const aStart = toDate(a0);
            const aEnd = toDate(a1);
            const bStart = toDate(b0);
            const bEnd = toDate(b1);
            
            if (!aStart || !aEnd || !bStart || !bEnd) return 0;
            if (aEnd < aStart || bEnd < bStart) return 0;
            
            const overlapStart = new Date(Math.max(aStart.getTime(), bStart.getTime()));
            const overlapEnd = new Date(Math.min(aEnd.getTime(), bEnd.getTime()));
            
            if (overlapStart > overlapEnd) return 0;
            
            const diffTime = overlapEnd.getTime() - overlapStart.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays + 1;
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date);
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const DAY_NAMES = ['Su','Mo','Tu','We','Th','Fr','Sa'];

        // Local-time-safe date helpers (avoid UTC shift from toISOString)
        function pad2(n) { return String(n).padStart(2, '0'); }

        function localTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function addDaysStr(dateStr, n) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + n);
            return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
        }

        function enumerateDates(start, end) {
            const startDate = toDate(start);
            const endDate = toDate(end);
            if (!startDate || !endDate || endDate < startDate) return [];
            const dates = [];
            const cursor = new Date(startDate);
            while (cursor <= endDate) {
                dates.push(`${cursor.getFullYear()}-${pad2(cursor.getMonth() + 1)}-${pad2(cursor.getDate())}`);
                cursor.setDate(cursor.getDate() + 1);
            }
            return dates;
        }

        // Where the child stays for this entry: an entry-level override wins,
        // otherwise the parent's default home address.
        function resolveLocation(entry, parentLocations) {
            if (!entry) return '';
            if (entry.location) return entry.location;
            return (parentLocations && parentLocations[entry.parent]) || '';
        }

        function getChildDayState(dateStr, entries, child) {
            const covering = entries
                .filter(entry => entry.parent && entry.beginDate && entry.endDate)
                .filter(entry => dateStr >= entry.beginDate && dateStr <= entry.endDate)
                .filter(entry => !child || (entry.childrenPresent && entry.childrenPresent[child]));
            // Holiday/exception entries override the recurring schedule.
            const exceptions = covering.filter(entry => entry.isException);
            const pool = exceptions.length ? exceptions : covering;
            const isException = exceptions.length > 0;
            const owners = [...new Set(pool.map(entry => entry.parent))];
            if (owners.length === 0) return { type: 'unassigned', child, parent: null, parents: [], isException: false, entry: null };
            // `entry` is the deciding entry, so callers can read location/exchange details.
            if (owners.length === 1) return { type: 'single', child, parent: owners[0], parents: owners, isException, entry: pool[0] };
            return { type: 'conflict', child, parent: null, parents: owners, isException, entry: null };
        }

        function getCalendarDayState(dateStr, entries, children, childFilter) {
            const selectedChildren = childFilter ? [childFilter] : (children.length ? children : [null]);
            const childStates = selectedChildren.map(child => getChildDayState(dateStr, entries, child));
            const isException = childStates.some(state => state.isException);
            if (childStates.some(state => state.type === 'conflict')) return { type: 'conflict', parent: null, childStates, isException };
            const assignedParents = [...new Set(childStates.filter(state => state.type === 'single').map(state => state.parent))];
            const hasUnassigned = childStates.some(state => state.type === 'unassigned');
            if (assignedParents.length === 0) return { type: 'unassigned', parent: null, childStates, isException };
            if (assignedParents.length === 1 && !hasUnassigned) return { type: 'single', parent: assignedParents[0], childStates, isException };
            return { type: 'split', parent: null, childStates, isException };
        }

        function computeCustodySummary({ entries, parents, children, start, end, childFilter }) {
            const dates = enumerateDates(start, end);
            const selectedChildren = childFilter === 'all' ? children : [childFilter];
            const primary = parents[0] || null;
            const totals = {};
            let conflictDays = 0;
            let totalUnits = 0;
            dates.forEach(dateStr => {
                selectedChildren.forEach(child => {
                    const state = getChildDayState(dateStr, entries, child);
                    if (state.type === 'conflict') { conflictDays += 1; return; }
                    const owner = state.type === 'single' ? state.parent : primary;
                    if (!owner) return;
                    totals[owner] = (totals[owner] || 0) + 1;
                    totalUnits += 1;
                });
            });
            const order = [...parents, ...Object.keys(totals).filter(parent => !parents.includes(parent))];
            return {
                rows: order.filter(parent => totals[parent]).map(parent => ({
                    parent,
                    custodyDays: totals[parent],
                    percentage: totalUnits ? Number(((totals[parent] / totalUnits) * 100).toFixed(1)) : 0,
                })),
                conflictDays,
                totalUnits,
            };
        }

        // ── Calendar export (iCalendar / .ics) ───────────────────────────────

        // Collapse consecutive days with the same parent into one block per child,
        // so a two-week stretch becomes one calendar event instead of fourteen.
        function buildCustodyBlocks({ entries, parents, children, start, end, childFilter, fillGapsWithPrimary = true }) {
            const dates = enumerateDates(start, end);
            if (dates.length === 0) return [];
            const primary = (parents && parents[0]) || null;
            const selected = childFilter && childFilter !== 'all'
                ? [childFilter]
                : (children && children.length ? children : [null]);

            const blocks = [];
            for (const child of selected) {
                let current = null;
                for (const dateStr of dates) {
                    const state = getChildDayState(dateStr, entries, child);
                    let owner = state.type === 'single' ? state.parent : null;
                    let deciding = state.entry;
                    if (!owner && state.type === 'unassigned' && fillGapsWithPrimary) {
                        owner = primary;
                        deciding = null;
                    }
                    if (current && owner === current.parent) { current.end = dateStr; continue; }
                    if (current) { blocks.push(current); current = null; }
                    if (owner) {
                        current = {
                            child, parent: owner, start: dateStr, end: dateStr,
                            entry: deciding, isException: Boolean(state.isException), inferred: !deciding,
                        };
                    }
                }
                if (current) blocks.push(current);
            }
            return blocks;
        }

        function escapeICSText(value) {
            return String(value == null ? '' : value)
                .replace(/\\/g, '\\\\')
                .replace(/;/g, '\\;')
                .replace(/,/g, '\\,')
                .replace(/\r?\n/g, '\\n');
        }

        function foldICSLine(line) {
            if (line.length <= 75) return line;
            const parts = [line.slice(0, 75)];
            let rest = line.slice(75);
            while (rest.length > 74) { parts.push(' ' + rest.slice(0, 74)); rest = rest.slice(74); }
            if (rest.length) parts.push(' ' + rest);
            return parts.join('\r\n');
        }

        function icsDate(dateStr) { return dateStr.replace(/-/g, ''); }

        // All-day DTEND is exclusive, so it points at the day after the block ends.
        function icsDayAfter(dateStr) {
            const d = toDate(dateStr);
            if (!d) return icsDate(dateStr);
            d.setDate(d.getDate() + 1);
            return icsDate(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`);
        }

        function slugForUid(value) {
            return String(value || '').replace(/[^A-Za-z0-9]/g, '') || 'x';
        }

        function buildICS({ blocks, parentLocations, calendarName = 'Custody Calendar', now = new Date(), singleChild = false }) {
            const dtstamp = `${now.getUTCFullYear()}${pad2(now.getUTCMonth() + 1)}${pad2(now.getUTCDate())}T${pad2(now.getUTCHours())}${pad2(now.getUTCMinutes())}${pad2(now.getUTCSeconds())}Z`;
            const lines = [
                'BEGIN:VCALENDAR',
                'VERSION:2.0',
                'PRODID:-//Custody Calendar//EN',
                'CALSCALE:GREGORIAN',
                'METHOD:PUBLISH',
                `X-WR-CALNAME:${escapeICSText(calendarName)}`,
            ];

            for (const block of blocks) {
                const who = block.child && !singleChild ? `${block.child} with ${block.parent}` : `With ${block.parent}`;
                const holidayName = block.isException && block.entry && block.entry.note ? block.entry.note : '';
                const summary = holidayName ? `${who} (${holidayName})` : who;
                const location = resolveLocation(block.entry, parentLocations)
                    || (parentLocations && parentLocations[block.parent]) || '';

                const descParts = [];
                if (block.entry && block.entry.exchangeTime) descParts.push(`Exchange time: ${block.entry.exchangeTime}`);
                if (block.entry && block.entry.exchangePlace) descParts.push(`Exchange place: ${block.entry.exchangePlace}`);
                if (block.entry && block.entry.note && block.entry.note !== holidayName) descParts.push(block.entry.note);
                if (block.inferred) descParts.push('Default schedule (no specific entry).');

                lines.push('BEGIN:VEVENT');
                lines.push(`UID:${slugForUid(block.child)}-${slugForUid(block.parent)}-${icsDate(block.start)}-${icsDate(block.end)}@custody-calendar`);
                lines.push(`DTSTAMP:${dtstamp}`);
                lines.push(`DTSTART;VALUE=DATE:${icsDate(block.start)}`);
                lines.push(`DTEND;VALUE=DATE:${icsDayAfter(block.end)}`);
                lines.push(`SUMMARY:${escapeICSText(summary)}`);
                if (location) lines.push(`LOCATION:${escapeICSText(location)}`);
                if (descParts.length) lines.push(`DESCRIPTION:${escapeICSText(descParts.join('\n'))}`);
                lines.push('TRANSP:TRANSPARENT');
                lines.push('END:VEVENT');
            }
            lines.push('END:VCALENDAR');
            return lines.map(foldICSLine).join('\r\n') + '\r\n';
        }

        // ── Kid view ─────────────────────────────────────────────────────────

        // Answers "where am I today, and when do I switch?" for one child.
        function getKidView({ entries, parents, children, child, today, daysAhead = 14 }) {
            const startDate = toDate(today);
            if (!startDate) return { current: null, next: null, daysUntilChange: null, upcoming: [] };
            const endDate = new Date(startDate);
            endDate.setDate(endDate.getDate() + daysAhead);
            const end = `${endDate.getFullYear()}-${pad2(endDate.getMonth() + 1)}-${pad2(endDate.getDate())}`;

            const blocks = buildCustodyBlocks({
                entries, parents, children, start: today, end, childFilter: child || 'all',
            });
            const current = blocks.find(b => today >= b.start && today <= b.end) || null;
            const next = blocks.find(b => b.start > today) || null;
            const daysUntilChange = next
                ? Math.round((toDate(next.start) - startDate) / 86400000)
                : null;
            return { current, next, daysUntilChange, upcoming: blocks };
        }

        // ── Shareable kid page ───────────────────────────────────────────────

        function escapeHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // Serialise the real functions into the shared page so it uses the same
        // logic rather than a drifting copy. `toDate` is aliased to `parseDate`
        // because the shared page's render code uses that name.
        function kidEngineSource() {
            const fns = [pad2, toDate, enumerateDates, getChildDayState, buildCustodyBlocks, getKidView, resolveLocation];
            return fns.map(fn => fn.toString()).join('\n\n') + '\n\nvar parseDate = toDate;';
        }

        // A self-contained HTML page for a child: no network, no CDN, no editing.
        // The data is embedded and re-evaluated on open, so it stays correct as
        // days pass within the exported window.
        function buildKidPage({ entries, parents, children, parentColors, parentLocations, parentPhones, validFrom, validTo, generatedOn }) {
            const data = { entries, parents, children, parentColors, parentLocations, parentPhones, validFrom, validTo, generatedOn };
            const json = JSON.stringify(data).replace(/</g, '\\u003c');
            const title = children && children.length ? `${children.join(' & ')} — Schedule` : 'Custody Schedule';

            return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${escapeHtml(title)}</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
         background:#f4f5f7; color:#111827; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:520px; margin:0 auto; }
  h1 { font-size:1.15rem; margin:0 0 12px; color:#374151; }
  .tabs { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin-bottom:12px; }
  .tab { border:none; border-radius:999px; padding:8px 16px; font-size:0.95rem; cursor:pointer;
         background:#e5e7eb; color:#374151; }
  .tab[aria-pressed="true"] { color:#fff; font-weight:700; }
  .today { border-radius:16px; padding:22px; color:#fff; margin-bottom:12px; }
  .today .label { font-size:0.72rem; letter-spacing:.14em; font-weight:700; opacity:.85; }
  .today .who { font-size:1.85rem; font-weight:800; margin:4px 0 10px; line-height:1.15; }
  .today .meta { font-size:1rem; margin-top:4px; }
  .card { background:#fff; border-radius:14px; padding:16px; margin-bottom:12px;
          box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card h2 { font-size:.72rem; letter-spacing:.1em; text-transform:uppercase; color:#6b7280; margin:0 0 8px; }
  .next-who { font-size:1.25rem; font-weight:700; }
  .next-when { color:#374151; margin-top:3px; }
  .next-meta { color:#4b5563; margin-top:6px; }
  .row { display:flex; align-items:center; padding:8px 0; }
  .bar { width:6px; height:34px; border-radius:3px; margin-right:12px; flex:none; }
  .row .name { font-weight:600; }
  .row .when { font-size:.85rem; color:#6b7280; }
  .foot { text-align:center; color:#6b7280; font-size:.8rem; margin-top:16px; line-height:1.5; }
  .warn { background:#fef3c7; border:1px solid #f59e0b; color:#92400e; border-radius:12px;
          padding:12px 14px; margin-bottom:12px; font-size:.9rem; }
  @media (prefers-color-scheme: dark) {
    body { background:#0f1115; color:#e5e7eb; }
    .card { background:#1a1d24; box-shadow:none; }
    h1, .next-who { color:#e5e7eb; }
    .next-when, .next-meta, .row .when, .foot { color:#9ca3af; }
    .tab { background:#272b33; color:#d1d5db; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>${escapeHtml(title)}</h1>
  <div id="tabs" class="tabs"></div>
  <div id="app"></div>
  <div class="foot" id="foot"></div>
</div>
<script>
const DATA = ${json};

${kidEngineSource()}

var COLOR_FALLBACK = ['#2563eb','#16a34a','#d97706','#7c3aed','#db2777','#0d9488'];
function colorFor(name, list, overrides) {
  if (overrides && overrides[name]) return overrides[name];
  var i = list.indexOf(name);
  return i >= 0 ? COLOR_FALLBACK[i % COLOR_FALLBACK.length] : '#9ca3af';
}
function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}
function fmt(ds, opts) {
  var d = parseDate(ds);
  return d ? d.toLocaleDateString('en-US', opts) : '';
}
var weekday = function (ds) { return fmt(ds, { weekday:'long' }); };
var shortDate = function (ds) { return fmt(ds, { month:'short', day:'numeric' }); };
function countdown(n) { return n === 0 ? 'today' : n === 1 ? 'tomorrow' : 'in ' + n + ' days'; }
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

        function CalendarView({ entries, parents, parentColors, children, childColors, onCreateEntry }) {

                const end = ds < pendingStart ? pendingStart : ds;

            const monthTally = {};

        // ── schedule generators ───────────────────────────────────────────────

        function generateEOWSchedule(secondaryParent, startDateStr, endDateStr, childrenList, weekendStartDay) {
            const entries = [];
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');
            const targetDay = weekendStartDay === 'fri' ? 5 : 6;

            let current = new Date(start);
            while (current.getDay() !== targetDay) current.setDate(current.getDate() + 1);

            let weekendNum = 0;
            while (current <= end) {
                if (weekendNum % 2 === 0) {
                    const wStart = new Date(current);
                    const wEnd = new Date(current);
                    while (wEnd.getDay() !== 0) wEnd.setDate(wEnd.getDate() + 1);
                    const actualStart = wStart < start ? new Date(start) : wStart;
                    const actualEnd = wEnd > end ? new Date(end) : wEnd;
                    if (actualStart <= actualEnd) {
                        const cp = {};
                        childrenList.forEach(c => { cp[c] = true; });
                        entries.push({
                            id: generateId(),
                            parent: secondaryParent,
                            beginDate: formatDate(actualStart),
                            endDate: formatDate(actualEnd),
                            childrenPresent: cp,
                            note: 'EOW'
                        });
                    }
                }
                current.setDate(current.getDate() + 7);
                weekendNum++;
            }
            return entries;
        }

        function generateJointWeeklySchedule(parent1, parent2, startDateStr, endDateStr, childrenList) {
            const entries = [];
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');

            let current = new Date(start);
            while (current.getDay() !== 1) current.setDate(current.getDate() + 1);

            let weekNum = 0;
            while (current <= end) {
                const wStart = new Date(current);
                const wEnd = new Date(current);
                wEnd.setDate(wEnd.getDate() + 6);
                const parent = weekNum % 2 === 0 ? parent1 : parent2;
                const actualStart = wStart < start ? new Date(start) : wStart;
                const actualEnd = wEnd > end ? new Date(end) : wEnd;
                if (actualStart <= actualEnd) {
                    const cp = {};
                    childrenList.forEach(c => { cp[c] = true; });
                    entries.push({
                        id: generateId(),
                        parent,
                        beginDate: formatDate(actualStart),
                        endDate: formatDate(actualEnd),
                        childrenPresent: cp,
                        note: `Week ${weekNum + 1}`
                    });
                }
                current.setDate(current.getDate() + 7);
                weekNum++;
            }
            return entries;
        }

        // ~70/30: every other weekend for the secondary parent plus one midweek
        // overnight (single day) each week.
        function generateEOWMidweek(secondaryParent, startDateStr, endDateStr, childrenList, weekendStartDay, midweekDow) {
            const entries = generateEOWSchedule(secondaryParent, startDateStr, endDateStr, childrenList, weekendStartDay);
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');
            let current = new Date(start);
            while (current.getDay() !== midweekDow) current.setDate(current.getDate() + 1);
            while (current <= end) {
                const cp = {};
                childrenList.forEach(c => { cp[c] = true; });
                const ds = `${current.getFullYear()}-${pad2(current.getMonth() + 1)}-${pad2(current.getDate())}`;
                entries.push({ id: generateId(), parent: secondaryParent, beginDate: ds, endDate: ds, childrenPresent: cp, note: 'Midweek' });
                current.setDate(current.getDate() + 7);
            }
            return entries;
        }

        // 50/50 "2-2-3" rotation between two parents over a 14-day cycle.
        function generate223(parent1, parent2, startDateStr, endDateStr, childrenList) {
            const entries = [];
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');
            const blocks = [
                [0, 1, parent1], [2, 3, parent2], [4, 6, parent1],
                [7, 8, parent2], [9, 10, parent1], [11, 13, parent2]
            ];
            const fmt = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            let cycle = new Date(start);
            while (cycle.getDay() !== 1) cycle.setDate(cycle.getDate() + 1); // first Monday
            while (cycle <= end) {
                for (const [o0, o1, parent] of blocks) {
                    const b = new Date(cycle); b.setDate(b.getDate() + o0);
                    const e = new Date(cycle); e.setDate(e.getDate() + o1);
                    if (e < start || b > end) continue;
                    const ab = b < start ? new Date(start) : b;
                    const ae = e > end ? new Date(end) : e;
                    const cp = {};
                    childrenList.forEach(c => { cp[c] = true; });
                    entries.push({ id: generateId(), parent, beginDate: fmt(ab), endDate: fmt(ae), childrenPresent: cp, note: '2-2-3' });
                }
                cycle.setDate(cycle.getDate() + 14);
            }
            return entries;
        }

        function DateRangePicker({ beginDate, endDate, onChangeDates }) {
            const [open, setOpen] = useState(false);
            const [popPos, setPopPos] = useState({ top: 0, left: 0 });
            const today = new Date();
            const initYear = beginDate ? parseInt(beginDate.split('-')[0]) : today.getFullYear();
            const initMonth = beginDate ? parseInt(beginDate.split('-')[1]) - 1 : today.getMonth();
            const [viewYear, setViewYear] = useState(initYear);
            const [viewMonth, setViewMonth] = useState(initMonth);
            const [pendingStart, setPendingStart] = useState(null);
            const [hoverDate, setHoverDate] = useState(null);
            const btnRef = useRef(null);
            const popRef = useRef(null);

            useEffect(() => {
                if (!open) return;
                const handler = (e) => {
                    const inBtn = btnRef.current && btnRef.current.contains(e.target);
                    const inPop = popRef.current && popRef.current.contains(e.target);
                    if (!inBtn && !inPop) {
                        setOpen(false);
                        setPendingStart(null);
                        setHoverDate(null);
                    }
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [open]);

            const handleOpen = () => {
                if (beginDate) {
                    setViewYear(parseInt(beginDate.split('-')[0]));
                    setViewMonth(parseInt(beginDate.split('-')[1]) - 1);
                }
                const rect = btnRef.current.getBoundingClientRect();
                const popWidth = 270;
                const left = rect.left + popWidth > window.innerWidth
                    ? rect.right - popWidth
                    : rect.left;
                setPopPos({ top: rect.bottom + 4, left });
                setPendingStart(null);
                setHoverDate(null);
                setOpen(true);
            };

            const prevMonth = () => {
                if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
                else setViewMonth(m => m - 1);
            };
            const nextMonth = () => {
                if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
                else setViewMonth(m => m + 1);
            };

            const handleDayClick = (dateStr) => {
                if (!pendingStart) {
                    setPendingStart(dateStr);
                    onChangeDates(dateStr, '');
                } else {
                    if (dateStr === pendingStart) {
                        setPendingStart(null);
                        onChangeDates('', '');
                        return;
                    }
                    const [start, end] = dateStr < pendingStart
                        ? [dateStr, pendingStart]
                        : [pendingStart, dateStr];
                    onChangeDates(start, end);
                    setPendingStart(null);
                    setHoverDate(null);
                    setOpen(false);
                }
            };

            const effectiveStart = pendingStart || beginDate;
            const effectiveEnd = pendingStart ? hoverDate : endDate;
            const todayStr = today.toISOString().split('T')[0];

            const rangeStart = effectiveStart && effectiveEnd
                ? (effectiveStart < effectiveEnd ? effectiveStart : effectiveEnd)
                : effectiveStart;
            const rangeEnd = effectiveStart && effectiveEnd
                ? (effectiveStart < effectiveEnd ? effectiveEnd : effectiveStart)
                : null;

            const isStart = (d) => d === rangeStart;
            const isEnd = (d) => rangeEnd && d === rangeEnd;
            const isInRange = (d) => rangeStart && rangeEnd && d > rangeStart && d < rangeEnd;

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDayOfWeek = new Date(viewYear, viewMonth, 1).getDay();

            const fmt = (d) => {
                if (!d) return '?';
                const [y, m, day] = d.split('-');
                return new Date(parseInt(y), parseInt(m) - 1, parseInt(day))
                    .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            const displayLabel = () => {
                if (!beginDate && !endDate) return 'Select dates';
                if (beginDate && !endDate) return `${fmt(beginDate)} → …`;
                return `${fmt(beginDate)} – ${fmt(endDate)}`;
            };

            const popover = open && ReactDOM.createPortal(
                <div ref={popRef} style={{
                    position: 'fixed',
                    zIndex: 9999,
                    top: popPos.top,
                    left: popPos.left,
                    background: 'white',
                    border: '1px solid #e5e7eb',
                    borderRadius: '0.5rem',
                    boxShadow: '0 10px 25px rgba(0,0,0,0.15)',
                    padding: '1rem',
                    minWidth: '270px'
                }}>
                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem'}}>
                                <button type="button" onClick={prevMonth} style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.3rem', padding: '0 0.4rem', color: '#374151'}}>‹</button>
                                <span style={{fontWeight: 600, fontSize: '0.95rem'}}>{MONTH_NAMES[viewMonth]} {viewYear}</span>
                                <button type="button" onClick={nextMonth} style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.3rem', padding: '0 0.4rem', color: '#374151'}}>›</button>
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', marginBottom: '4px'}}>
                                {DAY_NAMES.map(d => (
                                    <div key={d} style={{textAlign: 'center', fontSize: '0.72rem', fontWeight: 600, color: '#6b7280', padding: '2px 0'}}>{d}</div>
                                ))}
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px'}}>
                                {Array.from({length: firstDayOfWeek}).map((_, i) => <div key={'e'+i} />)}
                                {Array.from({length: daysInMonth}).map((_, i) => {
                                    const day = i + 1;
                                    const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                                    const sel = isStart(dateStr) || isEnd(dateStr);
                                    const inRange = isInRange(dateStr);
                                    const isToday = dateStr === todayStr;
                                    return (
                                        <div
                                            key={day}
                                            onMouseEnter={() => pendingStart && setHoverDate(dateStr)}
                                            onClick={() => handleDayClick(dateStr)}
                                            style={{
                                                textAlign: 'center',
                                                padding: '6px 2px',
                                                cursor: 'pointer',
                                                fontSize: '0.85rem',
                                                borderRadius: sel ? '50%' : (inRange ? '0' : '4px'),
                                                background: sel ? '#2563eb' : (inRange ? '#dbeafe' : 'transparent'),
                                                color: sel ? 'white' : (isToday && !inRange ? '#2563eb' : '#111827'),
                                                fontWeight: sel || isToday ? 700 : 400,
                                                userSelect: 'none'
                                            }}
                                        >
                                            {day}
                                        </div>
                                    );
                                })}
                            </div>
                            <div style={{marginTop: '0.6rem', textAlign: 'center', fontSize: '0.78rem', color: '#6b7280', minHeight: '1.2em'}}>
                                {pendingStart ? 'Now click the last day' : (beginDate && endDate ? '' : 'Click the first day')}
                            </div>
                            {beginDate && endDate && !pendingStart && (
                                <div style={{textAlign: 'center', marginTop: '0.25rem'}}>
                                    <button type="button" onClick={() => onChangeDates('', '')} style={{fontSize: '0.75rem', color: '#dc2626', background: 'none', border: 'none', cursor: 'pointer'}}>Clear dates</button>
                                </div>
                            )}
                </div>,
                document.body
            );

            return (
                <div style={{display: 'inline-block', width: '100%'}}>
                    <button
                        ref={btnRef}
                        type="button"
                        onClick={handleOpen}
                        style={{
                            width: '100%',
                            padding: '0.4rem 0.6rem',
                            border: '1px solid #d1d5db',
                            borderRadius: '0.375rem',
                            background: 'white',
                            cursor: 'pointer',
                            textAlign: 'left',
                            fontSize: '0.85rem',
                            color: beginDate ? '#111827' : '#9ca3af',
                            whiteSpace: 'nowrap'
                        }}
                    >
                        {displayLabel()}
                    </button>
                    {popover}
                </div>
            );
        }

            const [sP2, setSP2] = useState('');
            const [sEOWDay, setSEOWDay] = useState('fri');
            const [sMidweek, setSMidweek] = useState(3);
            const [sChildren, setSChildren] = useState([]);

            useEffect(() => {
                setSChildren(selected => selected.length ? selected.filter(child => dChildren.includes(child)) : dChildren);
                setAssignments(current => current
                    .map(assignment => ({ ...assignment, children: assignment.children.filter(child => dChildren.includes(child)) }))
                    .filter(assignment => assignment.children.length));
            }, [dChildren]);
            useEffect(() => {
                if (dParents.length) {
                    setSSecondary(value => dParents.includes(value) && value !== dParents[0] ? value : (dParents[1] || ''));
                    setSP1(value => dParents.includes(value) ? value : dParents[0]);
                    setSP2(value => dParents.includes(value) && value !== dParents[0] ? value : (dParents[1] || ''));
                }
            }, [dParents]);

            const presetLabel = (p) => ({
                'eow': 'Every other weekend (~80/20)',
                'eow-midweek': 'EOW + midweek (~70/30)',
                'joint-weekly': 'Alternating weeks (50/50)',
                '2-2-3': '2-2-3 rotation (50/50)'
            }[p] || p);

            const addParentW = () => { const n = pName.trim(); if (n && !dParents.includes(n)) { setDParents([...dParents, n]); setPName(''); } };
            const addChildW = () => { const n = cName.trim(); if (n && !dChildren.includes(n)) { setDChildren([...dChildren, n]); setCName(''); } };
            const makePrimaryW = (p) => setDParents([p, ...dParents.filter(x => x !== p)]);
            const toggleSChild = (c) => setSChildren(sChildren.includes(c) ? sChildren.filter(x => x !== c) : [...sChildren, c]);
            const assignmentIsValid = (assignment) => {
                if (!assignment.start || !assignment.end || assignment.start > assignment.end || !assignment.children.length) return false;
                if (assignment.preset === 'eow' || assignment.preset === 'eow-midweek') {
                    return dParents.includes(assignment.secondary) && assignment.secondary !== dParents[0];
                }
                return dParents.includes(assignment.p1) && dParents.includes(assignment.p2) && assignment.p1 !== assignment.p2;
            };

            const assignmentError = (() => {
                if (!sStart || !sEnd) return 'Set a start and end date.';
                if (sStart > sEnd) return 'The end date must be on or after the start date.';
                if (sChildren.length === 0) return 'Select at least one child.';
                if (dParents.length < 2) return 'Add two parents before creating a shared schedule.';
                if ((sPreset === 'eow' || sPreset === 'eow-midweek') && (!sSecondary || sSecondary === dParents[0])) return 'Choose a non-primary parent for weekends.';
                if ((sPreset === 'joint-weekly' || sPreset === '2-2-3') && (!sP1 || !sP2 || sP1 === sP2)) return 'Choose two different parents.';
                return '';
            })();

            const addAssignment = () => {
                if (assignmentError) return;
                let extra;
                if (sPreset === 'eow' || sPreset === 'eow-midweek') {
                    extra = { secondary: sSecondary };

                setAssignments([...assignments, { id: generateId(), preset: sPreset, start: sStart, end: sEnd, eowDay: sEOWDay, midweek: sMidweek, children: [...sChildren], ...extra }]);
                setSChildren(dChildren);

            const finish = () => {

                    alert('One or more schedules no longer match the selected parents or dates. Remove and recreate the highlighted schedule before continuing.');
                    return;

                const parentColors = {}; dParents.forEach(p => { parentColors[p] = initialData.parentColors?.[p] || nextColor(parentColors); });
                const childColors = {}; dChildren.forEach(c => { childColors[c] = initialData.childColors?.[c] || nextColor(childColors); });
                let generatedEntries = [];

                    generatedEntries = generatedEntries.concat(gen.map(entry => ({ ...entry, scheduleId: a.id })));

                const manualEntries = (initialData.entries || [])
