<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custody Calendar - Fully Configurable</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem 1.5rem 8rem;
            background-color: #f9fafb;
            min-height: 100vh;
        }
        
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            border: 1px solid #e5e7eb;

            margin-bottom: 1.5rem;
        }
        
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        
        .btn-primary {
            background-color: #2563eb;
            color: white;
        }
        
        .btn-primary:hover {

        }
        
        .btn-danger {

            color: white;
        }
        
        .btn-danger:hover {
            background-color: #b91c1c;
        }
        
        .btn-success {
            background-color: #16a34a;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #15803d;
        }
        
        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        
        .form-input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        
        .form-input:focus {
            outline: none;
            ring: 2px;
            ring-color: #3b82f6;
            border-color: #3b82f6;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        
        .table th,
        .table td {
            padding: 0.75rem;
            border: 1px solid #e5e7eb;
            text-align: left;
        }
        
        .table thead tr {
            background-color: #f3f4f6;
        }
        
        .table tbody tr:hover {
            background-color: #f9fafb;
        }
        
        .text-red {
            color: #dc2626;
        }
        
        .reporting-box {
            background-color: #f9fafb;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .config-box {
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .grid {
            display: grid;
            gap: 1rem;
        }
        
        .config-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }
        
        .config-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: white;
            border: 1px solid #d1d5db;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
        }
        
        .grid-cols-1 {
            grid-template-columns: repeat(1, minmax(0, 1fr));
        }
        
        @media (min-width: 768px) {
            .md\\:grid-cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }
        
        @media (min-width: 1024px) {
            .lg\\:grid-cols-5 {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }
        
        .flex {
            display: flex;
        }
        
        .flex-wrap {
            flex-wrap: wrap;
        }
        
        .gap-2 {
            gap: 0.5rem;
        }
        
        .gap-3 {
            gap: 0.75rem;
        }
        
        .gap-4 {
            gap: 1rem;
        }
        
        .mb-2 {
            margin-bottom: 0.5rem;
        }
        
        .mb-4 {
            margin-bottom: 1rem;
        }
        
        .mb-6 {
            margin-bottom: 1.5rem;
        }
        
        .mt-4 {
            margin-top: 1rem;
        }
        
        .mt-6 {
            margin-top: 1.5rem;
        }
        
        .text-sm {
            font-size: 0.875rem;
        }
        
        .text-lg {
            font-size: 1.125rem;
        }
        
        .text-2xl {
            font-size: 1.5rem;
        }
        
        .font-medium {
            font-weight: 500;
        }
        
        .font-semibold {
            font-weight: 600;
        }
        
        .font-bold {
            font-weight: 700;
        }
        
        .text-gray-600 {
            color: #4b5563;
        }
        
        .text-gray-700 {
            color: #374151;
        }
        
        .text-gray-900 {
            color: #111827;
        }
        
        .overflow-x-auto {
            overflow-x: auto;
        }
        
        .cursor-not-allowed {
            cursor: not-allowed;
        }
        
        .text-gray-400 {
            color: #9ca3af;
        }
        
        .w-5 {
            width: 1.25rem;
        }
        
        .h-5 {
            height: 1.25rem;
        }
        
        .checkbox {
            accent-color: #3b82f6;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useRef, useEffect } = React;

        // Date helper functions
        function toDate(d) {
            if (!d || typeof d !== 'string') return null;
            const parsed = new Date(d + 'T00:00:00.000');
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        function daysInclusive(start, end) {
            const startDate = toDate(start);
            const endDate = toDate(end);
            
            if (!startDate || !endDate || endDate < startDate) {
                return "";
            }
            
            const diffTime = endDate.getTime() - startDate.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays + 1;
        }

        function nightsInclusive(start, end) {
            const days = daysInclusive(start, end);
            if (days === "") return "";
            return Math.max(0, days - 1);
        }

        function overlapDays(a0, a1, b0, b1) {
            const aStart = toDate(a0);
            const aEnd = toDate(a1);
            const bStart = toDate(b0);
            const bEnd = toDate(b1);
            
            if (!aStart || !aEnd || !bStart || !bEnd) return 0;
            if (aEnd < aStart || bEnd < bStart) return 0;
            
            const overlapStart = new Date(Math.max(aStart.getTime(), bStart.getTime()));
            const overlapEnd = new Date(Math.min(aEnd.getTime(), bEnd.getTime()));
            
            if (overlapStart > overlapEnd) return 0;
            
            const diffTime = overlapEnd.getTime() - overlapStart.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            return diffDays + 1;
        }

        function generateId() {
            return Math.random().toString(36).substr(2, 9);
        }

        function formatDate(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toISOString().split('T')[0];
        }

        const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const DAY_NAMES = ['Su','Mo','Tu','We','Th','Fr','Sa'];

        // Local-time-safe date helpers (avoid UTC shift from toISOString)
        function pad2(n) { return String(n).padStart(2, '0'); }

        function localTodayStr() {
            const d = new Date();
            return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
        }

        function addDaysStr(dateStr, n) {
            const [y, m, d] = dateStr.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + n);
            return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
        }

        // Which parent has custody on the calendar day `dateStr`? An entry [begin,end]
        // covers every day from begin to end inclusive. Days not covered by any entry
        // are unassigned (shown gray on the calendar). When `childFilter` is set, only
        // entries that include that child are considered.
        function getDayOwner(dateStr, entries, childFilter) {
            const owners = [];
            for (const e of entries) {
                if (!e.beginDate || !e.endDate || !e.parent) continue;
                if (childFilter && !(e.childrenPresent && e.childrenPresent[childFilter])) continue;
                if (dateStr >= e.beginDate && dateStr <= e.endDate) owners.push(e.parent);
            }
            const distinct = [...new Set(owners)];
            if (distinct.length === 0) return { parent: null, conflict: false };
            if (distinct.length === 1) return { parent: distinct[0], conflict: false };
            return { parent: distinct[0], conflict: true };
        }

        const COLOR_CHOICES = [
            '#2563eb', // blue
            '#16a34a', // green
            '#d97706', // amber
            '#7c3aed', // purple
            '#db2777', // pink
            '#0d9488', // teal
            '#dc2626', // red
            '#ca8a04', // gold
            '#4f46e5', // indigo
            '#0891b2', // cyan
            '#65a30d', // lime
            '#e11d48', // rose
        ];

        // Resolve a stored color for a name, falling back to a palette color by position.
        function colorForName(name, list, overrides) {
            if (overrides && overrides[name]) return overrides[name];
            const i = list.indexOf(name);
            return i >= 0 ? COLOR_CHOICES[i % COLOR_CHOICES.length] : '#9ca3af';
        }

        // Pick the first palette color not already used by an existing name.
        function nextColor(overrides) {
            const used = Object.values(overrides || {});
            return COLOR_CHOICES.find(c => !used.includes(c)) || COLOR_CHOICES[Object.keys(overrides || {}).length % COLOR_CHOICES.length];
        }

        function CalendarView({ entries, parents, parentColors, children, childColors, onCreateEntry }) {
            const now = new Date();
            const [viewYear, setViewYear] = useState(now.getFullYear());
            const [viewMonth, setViewMonth] = useState(now.getMonth());
            const [pendingStart, setPendingStart] = useState(null);
            const [hoverDay, setHoverDay] = useState(null);
            const [pendingRange, setPendingRange] = useState(null); // {start, end} awaiting parent
            const [childFilter, setChildFilter] = useState(null); // null = all children

            const todayStr = localTodayStr();
            const colorFor = (parent) => colorForName(parent, parents, parentColors);

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDow = new Date(viewYear, viewMonth, 1).getDay();

            const resetSelection = () => { setPendingStart(null); setHoverDay(null); setPendingRange(null); };
            const prevMonth = () => {
                resetSelection();
                if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
                else setViewMonth(m => m - 1);
            };
            const nextMonth = () => {
                resetSelection();
                if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
                else setViewMonth(m => m + 1);
            };

            const handleDayClick = (ds) => {
                if (pendingRange) { setPendingRange(null); setPendingStart(ds); setHoverDay(null); return; }
                if (!pendingStart) { setPendingStart(ds); return; }
                const start = ds < pendingStart ? ds : pendingStart;
                const end = ds < pendingStart ? pendingStart : ds;
                setPendingRange({ start, end });
                setPendingStart(null);
                setHoverDay(null);
            };

            const monthTally = {};
            let hasConflict = false;
            for (let day = 1; day <= daysInMonth; day++) {
                const ds = `${viewYear}-${pad2(viewMonth + 1)}-${pad2(day)}`;
                const owner = getDayOwner(ds, entries, childFilter);
                if (owner.conflict) hasConflict = true;
                if (owner.parent) monthTally[owner.parent] = (monthTally[owner.parent] || 0) + 1;
            }

            // Selection highlighting helpers
            const previewLo = pendingStart && hoverDay ? (pendingStart < hoverDay ? pendingStart : hoverDay) : null;
            const previewHi = pendingStart && hoverDay ? (pendingStart < hoverDay ? hoverDay : pendingStart) : null;
            const inPreview = (ds) => previewLo && ds >= previewLo && ds <= previewHi;
            const inPendingRange = (ds) => pendingRange && ds >= pendingRange.start && ds <= pendingRange.end;
            const isSelEdge = (ds) => ds === pendingStart || (pendingRange && (ds === pendingRange.start || ds === pendingRange.end));

            const fmtLong = (ds) => {
                const [y, m, d] = ds.split('-');
                return new Date(parseInt(y), parseInt(m) - 1, parseInt(d))
                    .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            };

            const cells = [];
            for (let i = 0; i < firstDow; i++) cells.push(<div key={'b' + i} />);
            for (let day = 1; day <= daysInMonth; day++) {
                const ds = `${viewYear}-${pad2(viewMonth + 1)}-${pad2(day)}`;
                const owner = getDayOwner(ds, entries, childFilter);
                const col = owner.parent ? colorFor(owner.parent) : null;
                const isToday = ds === todayStr;
                const selEdge = isSelEdge(ds);
                const selRange = inPendingRange(ds) || inPreview(ds);
                let border = 'none';
                if (selEdge) border = '3px solid #2563eb';
                else if (selRange) border = '2px solid #93c5fd';
                else if (owner.conflict) border = '2px dashed #dc2626';
                cells.push(
                    <div
                        key={day}
                        onClick={() => handleDayClick(ds)}
                        onMouseEnter={() => { if (pendingStart) setHoverDay(ds); }}
                        style={{
                            aspectRatio: '1 / 1',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            cursor: 'pointer',
                            borderRadius: '8px',
                            background: col || '#e5e7eb',
                            border,
                            boxSizing: 'border-box',
                            userSelect: 'none'
                        }}
                    >
                        <span style={{
                            fontSize: '0.9rem',
                            fontWeight: isToday ? 800 : 600,
                            color: col ? '#fff' : '#9ca3af',
                            textDecoration: isToday ? 'underline' : 'none'
                        }}>{day}</span>
                    </div>
                );
            }

            const hint = pendingRange ? 'Choose which parent has custody for this range.'
                : pendingStart ? 'Now tap the END date (or tap the same day for a single day).'
                : 'Tap the START date, then the END date, to add a custody period.';

            return (
                <div>
                    <div className="card">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem' }}>
                            <button onClick={prevMonth} className="btn btn-secondary">‹</button>
                            <span style={{ fontSize: '1.1rem', fontWeight: 700 }}>{MONTH_NAMES[viewMonth]} {viewYear}</span>
                            <button onClick={nextMonth} className="btn btn-secondary">›</button>
                        </div>
                        <p style={{ fontSize: '0.8rem', color: '#2563eb', textAlign: 'center', marginBottom: '0.75rem' }}>{hint}</p>
                        {children && children.length > 1 && (
                            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, justifyContent: 'center', marginBottom: '0.75rem' }}>
                                <button onClick={() => setChildFilter(null)} className="btn btn-sm"
                                    style={{ background: childFilter === null ? '#111827' : '#e5e7eb', color: childFilter === null ? '#fff' : '#374151' }}>
                                    All children
                                </button>
                                {children.map(c => (
                                    <button key={c} onClick={() => setChildFilter(c)} className="btn btn-sm"
                                        style={{ background: childFilter === c ? colorForName(c, children, childColors) : '#e5e7eb', color: childFilter === c ? '#fff' : '#374151' }}>
                                        {c}
                                    </button>
                                ))}
                            </div>
                        )}
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '4px', marginBottom: '4px' }}>
                            {DAY_NAMES.map(d => (
                                <div key={d} style={{ textAlign: 'center', fontSize: '0.75rem', fontWeight: 600, color: '#9ca3af' }}>{d}</div>
                            ))}
                        </div>
                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '4px' }}>
                            {cells}
                        </div>
                    </div>

                    {pendingRange && (
                        <div className="config-box mb-6">
                            <h4 className="font-semibold mb-2">
                                New custody period: {fmtLong(pendingRange.start)} – {fmtLong(pendingRange.end)}
                                <span style={{ color: '#6b7280', fontWeight: 400 }}> · {daysInclusive(pendingRange.start, pendingRange.end)} days, {nightsInclusive(pendingRange.start, pendingRange.end)} nights</span>
                            </h4>
                            {parents.length === 0 ? (
                                <p className="text-sm text-gray-600">Add parents in the Entries tab first, then you can assign custody.</p>
                            ) : (
                                <div>
                                    <p className="text-sm text-gray-700 mb-2">Assign to:</p>
                                    <div className="flex flex-wrap gap-2">
                                        {parents.map((p, idx) => {
                                            const col = colorFor(p);
                                            return (
                                                <button key={p} className="btn"
                                                    style={{ background: col, color: '#fff' }}
                                                    onClick={() => { onCreateEntry(pendingRange.start, pendingRange.end, p, childFilter); resetSelection(); }}>
                                                    {p}{idx === 0 ? ' (Primary)' : ''}
                                                </button>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}
                            <button onClick={resetSelection} className="btn btn-secondary mt-4">Cancel</button>
                        </div>
                    )}

                    <div className="card">
                        <h4 className="font-medium text-gray-900 mb-2">Legend · days this month</h4>
                        {parents.length === 0 && (
                            <p className="text-sm text-gray-600">Add parents in the Entries tab to color the calendar.</p>
                        )}
                        {parents.map((p, idx) => {
                            const col = colorFor(p);
                            return (
                                <div key={p} style={{ display: 'flex', alignItems: 'center', padding: '4px 0' }}>
                                    <span style={{ width: 16, height: 16, borderRadius: 4, background: col, marginRight: 10 }} />
                                    <span style={{ flex: 1, color: '#374151' }}>{p}{idx === 0 ? ' (Primary)' : ''}</span>
                                    <span style={{ color: '#6b7280', fontWeight: 600 }}>{monthTally[p] || 0} days</span>
                                </div>
                            );
                        })}
                        <div style={{ display: 'flex', alignItems: 'center', padding: '4px 0' }}>
                            <span style={{ width: 16, height: 16, borderRadius: 4, background: '#e5e7eb', marginRight: 10 }} />
                            <span style={{ flex: 1, color: '#374151' }}>No custody entry</span>
                        </div>
                        {hasConflict && (
                            <p style={{ fontSize: '0.8rem', color: '#dc2626', marginTop: '0.5rem' }}>⚠ Some days have conflicting entries (outlined in red).</p>
                        )}
                        <p style={{ fontSize: '0.8rem', color: '#9ca3af', marginTop: '0.6rem' }}>
                            Each day is colored by the parent who has custody. Days with no custody entry are gray.
                        </p>
                    </div>
                </div>
            );
        }

        // ── schedule generators ───────────────────────────────────────────────

        function generateEOWSchedule(secondaryParent, startDateStr, endDateStr, childrenList, weekendStartDay) {
            const entries = [];
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');
            const targetDay = weekendStartDay === 'fri' ? 5 : 6;

            let current = new Date(start);
            while (current.getDay() !== targetDay) current.setDate(current.getDate() + 1);

            let weekendNum = 0;
            while (current <= end) {
                if (weekendNum % 2 === 0) {
                    const wStart = new Date(current);
                    const wEnd = new Date(current);
                    while (wEnd.getDay() !== 0) wEnd.setDate(wEnd.getDate() + 1);
                    const actualStart = wStart < start ? new Date(start) : wStart;
                    const actualEnd = wEnd > end ? new Date(end) : wEnd;
                    if (actualStart <= actualEnd) {
                        const cp = {};
                        childrenList.forEach(c => { cp[c] = true; });
                        entries.push({
                            id: generateId(),
                            parent: secondaryParent,
                            beginDate: actualStart.toISOString().split('T')[0],
                            endDate: actualEnd.toISOString().split('T')[0],
                            childrenPresent: cp,
                            note: 'EOW'
                        });
                    }
                }
                current.setDate(current.getDate() + 7);
                weekendNum++;
            }
            return entries;
        }

        function generateJointWeeklySchedule(parent1, parent2, startDateStr, endDateStr, childrenList) {
            const entries = [];
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');

            let current = new Date(start);
            while (current.getDay() !== 1) current.setDate(current.getDate() + 1);

            let weekNum = 0;
            while (current <= end) {
                const wStart = new Date(current);
                const wEnd = new Date(current);
                wEnd.setDate(wEnd.getDate() + 6);
                const parent = weekNum % 2 === 0 ? parent1 : parent2;
                const actualStart = wStart < start ? new Date(start) : wStart;
                const actualEnd = wEnd > end ? new Date(end) : wEnd;
                if (actualStart <= actualEnd) {
                    const cp = {};
                    childrenList.forEach(c => { cp[c] = true; });
                    entries.push({
                        id: generateId(),
                        parent,
                        beginDate: actualStart.toISOString().split('T')[0],
                        endDate: actualEnd.toISOString().split('T')[0],
                        childrenPresent: cp,
                        note: `Week ${weekNum + 1}`
                    });
                }
                current.setDate(current.getDate() + 7);
                weekNum++;
            }
            return entries;
        }

        // ~70/30: every other weekend for the secondary parent plus one midweek
        // overnight (single day) each week.
        function generateEOWMidweek(secondaryParent, startDateStr, endDateStr, childrenList, weekendStartDay, midweekDow) {
            const entries = generateEOWSchedule(secondaryParent, startDateStr, endDateStr, childrenList, weekendStartDay);
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');
            let current = new Date(start);
            while (current.getDay() !== midweekDow) current.setDate(current.getDate() + 1);
            while (current <= end) {
                const cp = {};
                childrenList.forEach(c => { cp[c] = true; });
                const ds = `${current.getFullYear()}-${pad2(current.getMonth() + 1)}-${pad2(current.getDate())}`;
                entries.push({ id: generateId(), parent: secondaryParent, beginDate: ds, endDate: ds, childrenPresent: cp, note: 'Midweek' });
                current.setDate(current.getDate() + 7);
            }
            return entries;
        }

        // 50/50 "2-2-3" rotation between two parents over a 14-day cycle.
        function generate223(parent1, parent2, startDateStr, endDateStr, childrenList) {
            const entries = [];
            const start = new Date(startDateStr + 'T00:00:00.000');
            const end = new Date(endDateStr + 'T00:00:00.000');
            const blocks = [
                [0, 1, parent1], [2, 3, parent2], [4, 6, parent1],
                [7, 8, parent2], [9, 10, parent1], [11, 13, parent2]
            ];
            const fmt = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
            let cycle = new Date(start);
            while (cycle.getDay() !== 1) cycle.setDate(cycle.getDate() + 1); // first Monday
            while (cycle <= end) {
                for (const [o0, o1, parent] of blocks) {
                    const b = new Date(cycle); b.setDate(b.getDate() + o0);
                    const e = new Date(cycle); e.setDate(e.getDate() + o1);
                    if (e < start || b > end) continue;
                    const ab = b < start ? new Date(start) : b;
                    const ae = e > end ? new Date(end) : e;
                    const cp = {};
                    childrenList.forEach(c => { cp[c] = true; });
                    entries.push({ id: generateId(), parent, beginDate: fmt(ab), endDate: fmt(ae), childrenPresent: cp, note: '2-2-3' });
                }
                cycle.setDate(cycle.getDate() + 14);
            }
            return entries;
        }

        function DateRangePicker({ beginDate, endDate, onChangeDates }) {
            const [open, setOpen] = useState(false);
            const [popPos, setPopPos] = useState({ top: 0, left: 0 });
            const today = new Date();
            const initYear = beginDate ? parseInt(beginDate.split('-')[0]) : today.getFullYear();
            const initMonth = beginDate ? parseInt(beginDate.split('-')[1]) - 1 : today.getMonth();
            const [viewYear, setViewYear] = useState(initYear);
            const [viewMonth, setViewMonth] = useState(initMonth);
            const [pendingStart, setPendingStart] = useState(null);
            const [hoverDate, setHoverDate] = useState(null);
            const btnRef = useRef(null);
            const popRef = useRef(null);

            useEffect(() => {
                if (!open) return;
                const handler = (e) => {
                    const inBtn = btnRef.current && btnRef.current.contains(e.target);
                    const inPop = popRef.current && popRef.current.contains(e.target);
                    if (!inBtn && !inPop) {
                        setOpen(false);
                        setPendingStart(null);
                        setHoverDate(null);
                    }
                };
                document.addEventListener('mousedown', handler);
                return () => document.removeEventListener('mousedown', handler);
            }, [open]);

            const handleOpen = () => {
                if (beginDate) {
                    setViewYear(parseInt(beginDate.split('-')[0]));
                    setViewMonth(parseInt(beginDate.split('-')[1]) - 1);
                }
                const rect = btnRef.current.getBoundingClientRect();
                const popWidth = 270;
                const left = rect.left + popWidth > window.innerWidth
                    ? rect.right - popWidth
                    : rect.left;
                setPopPos({ top: rect.bottom + 4, left });
                setPendingStart(null);
                setHoverDate(null);
                setOpen(true);
            };

            const prevMonth = () => {
                if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
                else setViewMonth(m => m - 1);
            };
            const nextMonth = () => {
                if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
                else setViewMonth(m => m + 1);
            };

            const handleDayClick = (dateStr) => {
                if (!pendingStart) {
                    setPendingStart(dateStr);
                    onChangeDates(dateStr, '');
                } else {
                    if (dateStr === pendingStart) {
                        setPendingStart(null);
                        onChangeDates('', '');
                        return;
                    }
                    const [start, end] = dateStr < pendingStart
                        ? [dateStr, pendingStart]
                        : [pendingStart, dateStr];
                    onChangeDates(start, end);
                    setPendingStart(null);
                    setHoverDate(null);
                    setOpen(false);
                }
            };

            const effectiveStart = pendingStart || beginDate;
            const effectiveEnd = pendingStart ? hoverDate : endDate;
            const todayStr = today.toISOString().split('T')[0];

            const rangeStart = effectiveStart && effectiveEnd
                ? (effectiveStart < effectiveEnd ? effectiveStart : effectiveEnd)
                : effectiveStart;
            const rangeEnd = effectiveStart && effectiveEnd
                ? (effectiveStart < effectiveEnd ? effectiveEnd : effectiveStart)
                : null;

            const isStart = (d) => d === rangeStart;
            const isEnd = (d) => rangeEnd && d === rangeEnd;
            const isInRange = (d) => rangeStart && rangeEnd && d > rangeStart && d < rangeEnd;

            const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
            const firstDayOfWeek = new Date(viewYear, viewMonth, 1).getDay();

            const fmt = (d) => {
                if (!d) return '?';
                const [y, m, day] = d.split('-');
                return new Date(parseInt(y), parseInt(m) - 1, parseInt(day))
                    .toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            };

            const displayLabel = () => {
                if (!beginDate && !endDate) return 'Select dates';
                if (beginDate && !endDate) return `${fmt(beginDate)} → …`;
                return `${fmt(beginDate)} – ${fmt(endDate)}`;
            };

            const popover = open && ReactDOM.createPortal(
                <div ref={popRef} style={{
                    position: 'fixed',
                    zIndex: 9999,
                    top: popPos.top,
                    left: popPos.left,
                    background: 'white',
                    border: '1px solid #e5e7eb',
                    borderRadius: '0.5rem',
                    boxShadow: '0 10px 25px rgba(0,0,0,0.15)',
                    padding: '1rem',
                    minWidth: '270px'
                }}>
                            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '0.75rem'}}>
                                <button type="button" onClick={prevMonth} style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.3rem', padding: '0 0.4rem', color: '#374151'}}>‹</button>
                                <span style={{fontWeight: 600, fontSize: '0.95rem'}}>{MONTH_NAMES[viewMonth]} {viewYear}</span>
                                <button type="button" onClick={nextMonth} style={{background: 'none', border: 'none', cursor: 'pointer', fontSize: '1.3rem', padding: '0 0.4rem', color: '#374151'}}>›</button>
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px', marginBottom: '4px'}}>
                                {DAY_NAMES.map(d => (
                                    <div key={d} style={{textAlign: 'center', fontSize: '0.72rem', fontWeight: 600, color: '#6b7280', padding: '2px 0'}}>{d}</div>
                                ))}
                            </div>
                            <div style={{display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: '2px'}}>
                                {Array.from({length: firstDayOfWeek}).map((_, i) => <div key={'e'+i} />)}
                                {Array.from({length: daysInMonth}).map((_, i) => {
                                    const day = i + 1;
                                    const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                                    const sel = isStart(dateStr) || isEnd(dateStr);
                                    const inRange = isInRange(dateStr);
                                    const isToday = dateStr === todayStr;
                                    return (
                                        <div
                                            key={day}
                                            onMouseEnter={() => pendingStart && setHoverDate(dateStr)}
                                            onClick={() => handleDayClick(dateStr)}
                                            style={{
                                                textAlign: 'center',
                                                padding: '6px 2px',
                                                cursor: 'pointer',
                                                fontSize: '0.85rem',
                                                borderRadius: sel ? '50%' : (inRange ? '0' : '4px'),
                                                background: sel ? '#2563eb' : (inRange ? '#dbeafe' : 'transparent'),
                                                color: sel ? 'white' : (isToday && !inRange ? '#2563eb' : '#111827'),
                                                fontWeight: sel || isToday ? 700 : 400,
                                                userSelect: 'none'
                                            }}
                                        >
                                            {day}
                                        </div>
                                    );
                                })}
                            </div>
                            <div style={{marginTop: '0.6rem', textAlign: 'center', fontSize: '0.78rem', color: '#6b7280', minHeight: '1.2em'}}>
                                {pendingStart ? 'Now click the last day' : (beginDate && endDate ? '' : 'Click the first day')}
                            </div>
                            {beginDate && endDate && !pendingStart && (
                                <div style={{textAlign: 'center', marginTop: '0.25rem'}}>
                                    <button type="button" onClick={() => onChangeDates('', '')} style={{fontSize: '0.75rem', color: '#dc2626', background: 'none', border: 'none', cursor: 'pointer'}}>Clear dates</button>
                                </div>
                            )}
                </div>,
                document.body
            );

            return (
                <div style={{display: 'inline-block', width: '100%'}}>
                    <button
                        ref={btnRef}
                        type="button"
                        onClick={handleOpen}
                        style={{
                            width: '100%',
                            padding: '0.4rem 0.6rem',
                            border: '1px solid #d1d5db',
                            borderRadius: '0.375rem',
                            background: 'white',
                            cursor: 'pointer',
                            textAlign: 'left',
                            fontSize: '0.85rem',
                            color: beginDate ? '#111827' : '#9ca3af',
                            whiteSpace: 'nowrap'

                    >

                    </button>
                    {popover}
                </div>
            );
        }
